# Fig. 12, stage E of the pipeline: the page's model against the full 3D solver on 50 random roads per regime
# (tools/fig12/validate.cjs). The report job writes notes/fig12/validation.md, commits it with the runs, and then fails if a stated
# tolerance is exceeded (tools/fig12/validate-report.cjs). Runs by hand and whenever the model, the solver, the glass or the data change.
name: Fig. 12 validation
on:
  workflow_dispatch:
  push:
    paths:
      - public/scripts/stout-modal.js
      - public/scripts/stout-cart.js
      - public/scripts/guinness-glass.js
      - public/data/fig12/**
      - tools/fig12/validate.cjs
      - tools/fig12/validate-report.cjs
      - .github/workflows/fig12-validate.yml
permissions:
  contents: write
concurrency:
  group: fig12-validate-${{ github.ref }}
  cancel-in-progress: true
jobs:
  roads:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        regime: [gentle, violent, vertical, spilling, fills]
        chunk: [1, 11, 21, 31, 41]
    steps:
      - uses: actions/checkout@v6
      - name: Ten roads
        run: |
          mkdir -p out
          node tools/fig12/validate.cjs ${{ matrix.regime }} ${{ matrix.chunk }} 10 out/${{ matrix.regime }}-${{ matrix.chunk }}.json
      - uses: actions/upload-artifact@v6
        with:
          name: fig12-validate-${{ matrix.regime }}-${{ matrix.chunk }}
          path: out/
  report:
    needs: roads
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v6
        with:
          pattern: fig12-validate-*
          path: notes/fig12/runs/validate
          merge-multiple: true
      - name: Report, commit, then judge
        run: |
          set +e; node tools/fig12/validate-report.cjs > "$RUNNER_TEMP/report.txt"; verdict=$?; set -e
          cat "$RUNNER_TEMP/report.txt"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add notes/fig12/validation.md notes/fig12/runs/validation-summary.json notes/fig12/runs/validate
          if ! git diff --cached --quiet; then git commit -m "Fig. 12 validation from workflow run ${{ github.run_id }}"; git pull --rebase origin "${GITHUB_REF_NAME}" && git push; fi
          exit $verdict
