# The scenes pipeline (docs/scenes-pipeline.md). Started by hand only, once per scene: GitHub -> Actions -> "Scenes on Kaggle" ->
# Run workflow -> the scene's name. Kaggle computes the scene's data once (all its runs, every random start recorded by its seed),
# this workflow checks the output by SHA-256 and commits it to public/data/scenes/, and Cloudflare publishes. Nothing runs on a
# timer and nothing reruns by itself.
name: Scenes on Kaggle
on:
  workflow_dispatch:
    inputs:
      scene: { description: "scene to compute (a model file tools/scenes/<scene>.py)", required: true, default: "barton" }
permissions:
  contents: write
concurrency:            # one Kaggle run at a time: each run is a new version of the same notebook
  group: scenes-kaggle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kaggle==2.2.5
      - name: Which scenes
        id: which
        run: |
          S="${{ github.event.inputs.scene }}"
          echo "scenes=$S" >> "$GITHUB_OUTPUT"; echo "scenes: $S"
      - name: Compute on Kaggle, check, store
        if: steps.which.outputs.scenes != ''
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "the repository secret KAGGLE_API_TOKEN is missing"; exit 1; }
          for s in ${{ steps.which.outputs.scenes }}; do python3 tools/scenes/pipeline.py "$s" "$GITHUB_SHA"; done
      - name: Commit the data
        if: steps.which.outputs.scenes != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/data/scenes
          git diff --cached --quiet && { echo "nothing new"; exit 0; }
          git commit -m "Scene data from Kaggle: ${{ steps.which.outputs.scenes }}(notebook numakoudsie/scenes-living-backgrounds, code ${GITHUB_SHA::7})"
          for i in 1 2 3; do git pull --rebase -q origin main && git push origin HEAD:main && exit 0; sleep 5; done; exit 1
