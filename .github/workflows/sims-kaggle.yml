# The simulations pipeline (docs/kaggle-sims.md): making a simulation's data. It starts by itself when a simulation's model
# tools/sims/<sim>.py is added or changed on main, and can be started by hand (Actions -> "Simulations on Kaggle" -> Run workflow).
# Kaggle computes the simulation's whole data once (every run and every random start, each recorded by its seed), this workflow checks
# the output by SHA-256 and commits it to public/data/sims/, and Cloudflare publishes. No timer: an unchanged model never reruns.
name: Simulations on Kaggle
on:
  push:
    branches: [main]
    paths: ["tools/sims/*.py"]   # which of them are simulations is decided by tools/sims/registry.json, in the step "Which simulations"
  workflow_dispatch:
    inputs:
      sim: { description: "simulation to compute (a model file tools/sims/<sim>.py, listed in tools/sims/registry.json)", required: true, default: "barton" }
  workflow_call:        # used by the Kaggelize flow (kaggelize-land.yml), after the owner approved: compute <sim> from the commit <ref>
    inputs:             # of a session's branch; the commit step below then puts that branch and its data on main in one push
      sim: { type: string, required: true }
      ref: { type: string, required: false, default: "" }
permissions:
  contents: write
concurrency:            # one Kaggle run at a time: each run is a new version of the same notebook
  group: sims-kaggle
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 360   # GPU runs with large data (registry "gpu", "store": "release") can take hours on Kaggle
    outputs:
      sims: ${{ steps.which.outputs.sims }}
      sha: ${{ steps.which.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: "${{ inputs.ref || github.sha }}", fetch-depth: "${{ inputs.ref && '0' || '2' }}" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install kaggle==2.2.5 six   # kaggle 2.2.5 imports six without declaring it
      - name: Which simulations
        id: which
        env: { SIM: "${{ inputs.sim }}" }
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"     # the commit whose code Kaggle runs (a branch's commit when called with ref)
          if [ -n "$SIM" ]; then S="$SIM"
          else S=$(git diff --name-only HEAD~1 HEAD -- 'tools/sims/*.py' | xargs -r -n1 basename | sed 's/\.py$//' | tr '\n' ' '); fi
          # only simulations listed in tools/sims/registry.json are computed; other files in the folder are the machinery
          S=$(python3 -c "import json,sys; r=json.load(open('tools/sims/registry.json'))['sims']; print(' '.join(x for x in sys.argv[1:] if x in r))" $S)
          echo "sims=$S" >> "$GITHUB_OUTPUT"; echo "simulations: $S"
      - name: Room for large data
        if: steps.which.outputs.sims != ''
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL; df -h / | tail -1   # about 30 GB free for a large run's download
      - name: Compute on Kaggle, check, store
        if: steps.which.outputs.sims != ''
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          GH_TOKEN: ${{ github.token }}   # large data goes into a GitHub release (tools/sims/pipeline.py, step 5a); contents: write allows it
        run: |
          test -n "$KAGGLE_API_TOKEN" || { echo "the repository secret KAGGLE_API_TOKEN is missing"; exit 1; }
          for s in ${{ steps.which.outputs.sims }}; do python3 tools/sims/pipeline.py "$s" "${{ steps.which.outputs.sha }}"; done
      - name: Commit the data
        if: steps.which.outputs.sims != ''
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # built afresh on the newest main, generations.json merged entry by entry, docs/files.md generated again (tools/sims/land.py);
          # replaces "git pull --rebase", which stopped at a clash in docs/files.md on 23 November 2026 and saved nothing
          python3 tools/sims/land.py "${{ steps.which.outputs.sims }}" "${{ steps.which.outputs.sha }}"
  live:
    # step 10: wait for Cloudflare to publish, then check the live files and the live pages (tools/sims/verify_live.py)
    needs: run
    if: needs.run.outputs.sims != ''
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install playwright==1.65.2 && python -m playwright install --with-deps chromium
      - name: Check the live site
        run: for s in ${{ needs.run.outputs.sims }}; do python3 tools/sims/verify_live.py "$s" "${{ needs.run.outputs.sha }}"; done
