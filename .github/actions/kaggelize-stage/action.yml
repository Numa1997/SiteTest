# One box of the Kaggelize flow (docs/kaggelize.md): set the board row, install the tools, run one Claude Code session through
# tools/sims/agents/stage.py, push what it committed, set the board row again. Used by kaggelize-one.yml and kaggelize-land.yml.
name: Kaggelize stage
description: Run one Claude Code session (study, build, caretaker or fix) on one simulation and push its commit.
inputs:
  stage:  { description: "study | build | caretaker | fix", required: true }
  title:  { description: "the simulation's title", required: true }
  slug:   { description: "the simulation's short name", required: true }
  round:  { description: "1..3", default: "1" }
  model:  { description: "model for the session, or 'default'", default: "default" }
  label:  { description: "what the board shows while this runs", required: true }
  next:   { description: "what the board shows when this succeeded", required: true }
  next_link: { description: "the link the board shows when this succeeded", default: "" }
  github_token: { description: "token for the board and the push", required: true }
  claude_token: { description: "the secret CLAUDE_CODE_OAUTH_TOKEN", required: true }
outputs:
  branch: { description: "branch the session worked on", value: "${{ steps.session.outputs.branch }}" }
  sha:    { description: "its commit", value: "${{ steps.session.outputs.sha }}" }
  clear:  { description: "caretaker only: true or false", value: "${{ steps.session.outputs.clear }}" }
runs:
  using: composite
  steps:
    - name: Board, running
      shell: bash
      env: { GH_TOKEN: "${{ inputs.github_token }}", TITLE: "${{ inputs.title }}", SLUG: "${{ inputs.slug }}", LABEL: "${{ inputs.label }}" }
      run: python3 tools/sims/agents/board.py set "$SLUG" "$TITLE" "$LABEL" "running" "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
    - uses: actions/setup-node@v4
      with: { node-version: "22" }
    - uses: actions/setup-python@v5
      with: { python-version: "3.12" }
    - name: Tools the session needs (Claude Code, NumPy, SciPy, a real browser)
      shell: bash
      run: |
        npm install -g @anthropic-ai/claude-code >/dev/null
        pip install -q numpy scipy sympy playwright==1.65.2
        python -m playwright install --with-deps chromium >/dev/null
        claude --version
    - name: The session
      id: session
      shell: bash
      env:
        CLAUDE_CODE_OAUTH_TOKEN: "${{ inputs.claude_token }}"
        GH_TOKEN: "${{ inputs.github_token }}"       # stage.py reads the owner's notes with it, then hides it from the session
        TITLE: "${{ inputs.title }}"
        SLUG: "${{ inputs.slug }}"
        ROUND: "${{ inputs.round }}"
        MODEL: "${{ inputs.model != 'default' && inputs.model || '' }}"
      run: python3 tools/sims/agents/stage.py "${{ inputs.stage }}"
    - name: Push the session's commit
      shell: bash
      env: { GH_TOKEN: "${{ inputs.github_token }}", BRANCH: "${{ steps.session.outputs.branch }}" }
      run: |
        URL="https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
        if [ "$BRANCH" = main ]; then      # the caretaker's report goes straight to main: it is notes only (stage.py made sure)
          for i in 1 2 3; do git -c user.name=kaggelize -c user.email=kaggelize@users.noreply.github.com pull --rebase -q origin main && git push -q "$URL" HEAD:main && exit 0; sleep 5; done; exit 1
        fi
        case "$BRANCH" in kaggelize/*-fix[0-9]) F=--force ;; *) F= ;; esac
        git push -q $F "$URL" "HEAD:refs/heads/$BRANCH"
    - name: Board, what comes next
      if: always()
      shell: bash
      env: { GH_TOKEN: "${{ inputs.github_token }}", TITLE: "${{ inputs.title }}", SLUG: "${{ inputs.slug }}", LABEL: "${{ inputs.label }}", NEXT: "${{ inputs.next }}", LINK: "${{ inputs.next_link }}", OK: "${{ job.status }}" }
      run: |
        RUN="$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
        if [ "$OK" = success ]; then python3 tools/sims/agents/board.py set "$SLUG" "$TITLE" "$LABEL" "$NEXT" "${LINK:-$RUN}"
        else python3 tools/sims/agents/board.py set "$SLUG" "$TITLE" "$LABEL" "failed: open the run" "$RUN"; fi
