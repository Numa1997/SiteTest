<text class="m" x="169.4" y="187.0">k<tspan class="mu" font-size="12" dy="4">0</tspan></text>
<text class="lbl" x="135.6" y="243.8" text-anchor="middle">packet at x₀ = −14</text>
<line x1="210.0" y1="196.0" x2="225.0" y2="181.0" stroke="#1c1518" stroke-width="1"/>
