<svg viewBox="0 0 720 392" role="img" aria-label="The computational box seen in the plane z = 0: the sphere of radius R at the centre, the starting packet at x = −14, the three slabs behind, inside and ahead, and the absorbing border." xmlns="http://www.w3.org/2000/svg">
