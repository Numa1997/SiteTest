<text class="lbl" x="210.0" y="382.0" text-anchor="middle">x = −R and x = +R (dashed)</text>
<text class="lbl" x="44" y="38">absorbing border, 6 a</text>
<line x1="284.4" y1="339.4" x2="337.5" y2="339.4" stroke="#1c1518" stroke-width="1.6"/><text class="tick" x="310.9" y="333.4" text-anchor="middle">10 a</text>
<text class="m" x="388.0" y="201.0">x</text><text class="m" x="24.0" y="40.0">y</text>
<text class="lbl" x="440" y="46">Box: side 64 a, periodic</text>
<text class="lbl" x="440" y="66">128³ points, Δx = 0.5 a</text>
<text class="lbl" x="440" y="106">Sphere: radius R, V = V₀ inside</text>
<text class="lbl" x="440" y="126">Packet: width σ₀ = 3 a,</text>
<text class="lbl" x="440" y="146">centre x₀ = −14 a, wave number k₀</text>
<text class="lbl" x="440" y="186">Slabs counted from the whole 3D ψ:</text>
<text class="lbl" x="440" y="206">behind  x < −R</text>
<text class="lbl" x="440" y="226">inside  −R ≤ x ≤ R</text>
<text class="lbl" x="440" y="246">ahead   x > R</text>
<text class="lbl" x="440" y="286">Shaded frame: the outer 12 cells</text>
<text class="lbl" x="440" y="306">of each face, where the mask</text>
