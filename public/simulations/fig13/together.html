    for (const z of [0.25, 0.5, 0.75, 1.0, 1.25, 1.5]) { g.strokeStyle = rgba(TH.dome, TH.domeA * 1.4); poly(g, ring(2 * Math.cos(z), z, 96), true); g.stroke(); }
    // the path lifted onto the bell: recent part bright, older part fading
    const age = Math.round(1.1 * O.rate), back = Math.min(age, Math.round(e * O.rate));
    g.globalCompositeOperation = TH.add; g.lineCap = 'butt';
    for (let m = back; m > 0; m -= 8) {

        const p0 = pr(X[k0], H[k0], Z[k0]), p1 = pr(X[k1], H[k1], Z[k1]);
        g.strokeStyle = rgba(TH.lifted, 0.1 * al); g.lineWidth = 5.5; poly(g, [p0, p1]); g.stroke();
        g.strokeStyle = rgba(TH.lifted, 0.9 * al); g.lineWidth = 1.7; poly(g, [p0, p1]); g.stroke();
    }
    g.globalCompositeOperation = 'source-over'; g.lineCap = 'round';
    const hd = pr(X[i], H[i], Z[i]);
    g.strokeStyle = TH.plumb; g.lineWidth = 1.5; g.setLineDash([2, 5]); poly(g, [tip, hd]); g.stroke(); g.setLineDash([]);
    g.strokeStyle = TH.head; g.lineWidth = 1.6; g.beginPath(); g.arc(tip[0], tip[1], 12, 0, 7); g.stroke();
    dot(g, hd[0], hd[1], 5.5);
}

// ------------------------------------------------------------------------------------------------ 6: the butterfly, long exposure
function drawButterfly(g, w, h, f, t, e) {
    const cx = w / 2, cy = centreY(h), S = PHONE ? Math.min(AW / 4.3, AH / 3.9) : 84;
    g.strokeStyle = TH.grid; g.lineWidth = 1; for (const rr of [1, 2]) { g.beginPath(); g.arc(cx, cy, rr * S, 0, 7); g.stroke(); }
    const n = Math.round(e / O.T * NN);
    g.globalCompositeOperation = TH.add; g.lineJoin = 'round'; g.lineCap = 'butt';
    for (let j = 0; j + 2 <= n; j += 2) {
        const u = j / NN, x0 = cx + S * XS[j], y0 = cy - S * HS[j], x1 = cx + S * XS[j + 2], y1 = cy - S * HS[j + 2];
        g.strokeStyle = rampCol(u, TH.glowA * 1.4); g.lineWidth = 8; poly(g, [[x0, y0], [x1, y1]]); g.stroke();
        g.strokeStyle = rampCol(u, 0.97); g.lineWidth = 2.3; poly(g, [[x0, y0], [x1, y1]]); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    const [a, b] = angles(t), x1 = cx + S * Math.sin(a), y1 = cy + S * Math.cos(a), x2 = x1 + S * Math.sin(b), y2 = y1 + S * Math.cos(b);
    g.globalAlpha = 0.5; g.lineCap = 'round'; g.strokeStyle = TH.rods; g.lineWidth = 4; poly(g, [[cx, cy], [x1, y1], [x2, y2]]); g.stroke(); g.globalAlpha = 1;
    pivot(g, cx, cy); dot(g, x2, y2, 6);
}

// ------------------------------------------------------------------------------------------------ frame
let g, DPR = 1;
const memo = {};
function setHTML(el, key, html) { if (memo[key] !== html) { memo[key] = html; el.innerHTML = html; } }
function setClass(el, key, cls) { if (memo[key] !== cls) { memo[key] = cls; el.className = cls; } }
function frameRect(p, ph, f, i) {
    const rr = (dx) => { g.beginPath(); g.roundRect(p.x + dx, p.y + dx, p.w - 2 * dx, p.h - 2 * dx, 16 - dx); };
    if (ph === 'off') { g.globalAlpha = 0.5; g.fillStyle = TH.panel; rr(0.5); g.fill(); g.setLineDash([5, 6]); g.strokeStyle = TH.rule; g.lineWidth = 1; g.stroke(); g.setLineDash([]); g.globalAlpha = 1; return; }
    g.fillStyle = TH.panel; rr(0.5); g.fill();
}
function frameEdge(p, ph, f, i) {
    const on = ease((f - A(i)) / TR), leave = i < 5 ? ease((f - A(i + 1)) / TR) : ease((f - FINALE()) / TR);
    const hot = ph === 'off' ? 0 : on * (1 - leave);
    g.beginPath(); g.roundRect(p.x + 0.5, p.y + 0.5, p.w - 1, p.h - 1, 16);
    g.strokeStyle = TH.rule; g.lineWidth = 1; g.stroke();
    if (hot > 0.01) { g.globalAlpha = hot; g.strokeStyle = TH.accent; g.lineWidth = 2.2; g.stroke(); g.globalAlpha = 1; }
}
function renderFrame(f) {
    g.setTransform(DPR, 0, 0, DPR, 0, 0); g.fillStyle = TH.bg; g.fillRect(0, 0, SW, SH);
    const t = simT(f);
    PANELS.forEach((p, i) => {
        const ph = phase(f, i);
        frameRect(p, ph, f, i);
        if (ph !== 'off') {
            g.save(); g.beginPath(); g.roundRect(p.x + 1, p.y + 1, p.w - 2, p.h - 2, 15); g.clip(); g.translate(p.x, p.y);
            const e = drawn(f, i), fade = ease((f - A(i)) / TR);
            g.globalAlpha = 1;
            if (i === 0) drawPendulum(g, p.w, p.h, f, t);
            else if (i === 1) drawSheet(g, p.w, p.h, t, e, 0, 1, true);
            else if (i === 2) drawSheet(g, p.w, p.h, t, O.T, phiOf(f), fade, true);
            else if (i === 3) drawClock(g, p.w, p.h, f, t);
            else if (i === 4) drawBell(g, p.w, p.h, f, t, e);
            else drawButterfly(g, p.w, p.h, f, t, e);
            if (i === 2) { g.fillStyle = TH.muted; g.font = (LF + 1) + 'px "IBM Plex Mono"'; g.textAlign = 'right'; g.fillText(`φ = ${(phiOf(f) * 180 / Math.PI).toFixed(0)}°`, p.w - 24, 36); }
            // an older picture is shaded while a newer one is drawing; at the end all six are equal
            const shade = ph === 'past' ? 0.3 * ease((f - A(i + 1)) / TR) : ph === 'all' ? 0.3 * (1 - ease((f - FINALE()) / TR)) : 0;
            if (shade > 0.005) { g.globalAlpha = shade; g.fillStyle = TH.panel; g.fillRect(0, 0, p.w, p.h); g.globalAlpha = 1; }
            g.restore();
        }
        frameEdge(p, ph, f, i);
        setClass(p.elT, 'tc' + i, 'ttl' + (ph === 'off' ? ' off' : '')); setClass(p.elC, 'cc' + i, 'cap' + (ph === 'off' ? ' off' : ''));
    });
    const k = f < INTRO ? -1 : Math.min(5, Math.floor((f - INTRO) / P));
    const line2 = f < INTRO ? 'six pictures of one motion' : f >= FINALE() ? 'all six pictures, moving together' : `picture <b>${k + 1}</b> of 6 is drawing: ${PANELS[k].title.toLowerCase()}`;
    const sep = ' · ';
    setHTML($('clock'), 'clock', `t = <b>${t.toFixed(3)}</b> s of ${O.T.toFixed(3)} s${sep}${PHONE ? '¼ speed' : 'shown at ¼ speed'}<br>${line2}`);
}
window.renderFrame = renderFrame;

async function boot() {
    DPR = window.devicePixelRatio || 1;
    O = await (await fetch('orbit24.json')).json(); prep();
    P = O.T * FPS * SLOW; TOTAL = Math.ceil(INTRO + (6 + HOLDS) * P) + 12;
    $('h2').textContent = `two equal rods, 1 kg and 1 m each, kicked once with p = (${O.p1.toFixed(3)}, ${O.p2.toFixed(3)}) kg·m²/s. Each new picture joins on the next swing; one clock drives all six.`;
    const c = $('cv'); c.width = SW * DPR; c.height = SH * DPR; c.style.width = SW + 'px'; c.style.height = SH + 'px'; g = c.getContext('2d');
    PANELS.forEach((p, i) => {
        p.elT = document.createElement('div'); p.elT.className = 'ttl'; p.elT.style.left = (p.x + 24) + 'px'; p.elT.style.top = (p.y + (PHONE ? 24 : 20)) + 'px';
        p.elT.innerHTML = `<small>${i + 1}</small>${p.title}`; $('stage').appendChild(p.elT);
        p.elC = document.createElement('div'); p.elC.className = 'cap'; p.elC.style.left = (p.x + 24) + 'px'; p.elC.style.top = (p.y + p.h - (PHONE ? 50 : 36)) + 'px';
        katex.render(p.cap, p.elC, { throwOnError: false }); $('stage').appendChild(p.elC);
    });
    await document.fonts.ready;
    await Promise.all(['IBM Plex Mono', 'IBM Plex Sans', 'Instrument Serif'].map(fn => document.fonts.load(`20px "${fn}"`)));
    window.FILM = { FPS, SLOW, INTRO, P, frames: () => TOTAL };
    renderFrame(Number(Q.get('f') || 0)); window.__ready = true;
    if (!Q.get('film')) { let f = 0; const loop = () => { renderFrame(f % TOTAL); f++; requestAnimationFrame(loop); }; loop(); }
}
function fit() { const s = Math.min(innerWidth / SW, innerHeight / SH, 1); $('stage').style.transform = `scale(${s})`; }
if (!Q.get('film')) { fit(); addEventListener('resize', fit); }
boot();
</script>
