<script>
"use strict";
document.documentElement.lang="en";document.documentElement.dir="ltr";
/*PHYSICS-BEGIN*/
// Every number of the animation lives in P. Scaled units: length in drawing units, mass 1 per ball, time in seconds.
const P={
  g:9.81, h:10.0, M:1.0, dt:2e-4, tmax:9.0,
  iron:{R:0.5, a:0.10, k:1e5, ar0:3.95, c:2, rad:0.035, sub:5},
  cot:{R:1.3, nf:18, nb:34, s:0.08, turn:0.35, kax:300, kb:0.25, cb:0.004, c:0.3,
       jr:0.07, kj:40, Fj:4, drep:0.06, krep:20, crep:0.4, rad:0.03, seed:5, sub:2},
  head:{mp:0.2, kh:6000, ch:62, wc:1350, zc:0.5}
};
function rng(seed){return()=>{seed=(seed*16807)%2147483647;return(seed-1)/2147483646}}
function gauss(r){let u=0;while(!u)u=r();const v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

// A body: particles (positions x,y; velocities u,v; forces fx,fy), bonds, bending triplets.
function newBody(kind,pts,fibre){
  const N=pts.length;
  let ymin=Infinity;for(const p of pts)ymin=Math.min(ymin,p.y);
  const rad=P[kind==='iron'?'iron':'cot'].rad,lift=P.h-ymin+rad; // lowest point starts exactly h above the plate
  const b={kind,N,m:P.M/N,rad,
    x:new Float64Array(N),y:new Float64Array(N),u:new Float64Array(N),v:new Float64Array(N),
    fx:new Float64Array(N),fy:new Float64Array(N),fib:new Int32Array(N),
    bonds:[],tri:[],yp:0,vp:0,t:0,Fmax:0,tImpact:null,heat:0,heatBall:0,heatHead:0,Pd:0,Pdh:0,Ebond:0,Ebend:0,Erep:0,y00:0};
  b.kc=b.m*P.head.wc*P.head.wc;b.cc=2*P.head.zc*b.m*P.head.wc;   // skin contact: every particle rebounds in the same time 2π/wc, damping ratio zc
  pts.forEach((p,i)=>{b.x[i]=p.x;b.y[i]=p.y+lift;b.fib[i]=fibre?fibre[i]:0});
  let yc=0;for(let i=0;i<N;i++)yc+=b.y[i];b.y00=yc/N-P.h;  // height energy measured so that it starts at exactly M g h
  return b;
}
function packBonds(b,list){
  const n=list.length;b.nb=n;
  b.bi=new Int32Array(n);b.bj=new Int32Array(n);b.l0=new Float64Array(n);b.type=new Uint8Array(n); // 0 Morse metal, 1 fibre axial, 2 junction
  b.D=new Float64Array(n);b.al=new Float64Array(n);b.k=new Float64Array(n);b.brk=new Float64Array(n);b.alive=new Uint8Array(n);b.strain=new Float64Array(n);
  list.forEach((s,q)=>{b.bi[q]=s.i;b.bj[q]=s.j;b.l0[q]=s.l0;b.type[q]=s.type;b.D[q]=s.D||0;b.al[q]=s.al||0;b.k[q]=s.k||0;b.brk[q]=s.brk||1e9;b.alive[q]=1});
}
function makeIron(){
  const q=P.iron,pts=[],n=8;
  for(let j=-n;j<=n;j++)for(let i=-n;i<=n;i++){
    const x=(i+(j&1)*0.5)*q.a,y=j*q.a*Math.sqrt(3)/2;
    if(x*x+y*y<=q.R*q.R+1e-9)pts.push({x,y});
  }
  const b=newBody('iron',pts);
  const al=q.ar0/q.a,D=q.k/(2*al*al),L=[];   // Morse: bond stiffness at the minimum is 2 D al^2 = k
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<q.a*1.05)L.push({i,j,l0:d,type:0,D,al});
  }
  packBonds(b,L);b.c=q.c;b.Dm=D;b.alm=al;
  b.ntri=0;return b;
}
function turnAngle(ax,ay,bx,by,cx,cy){const ux=bx-ax,uy=by-ay,vx=cx-bx,vy=cy-by;return Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy)}
function makeCotton(){
  const q=P.cot,r=rng(q.seed),pts=[],fibre=[],fibIdx=[];
  for(let f=0;f<q.nf;f++){             // each fibre: a persistent random walk that turns back at the ball's edge
    let x,y;do{x=(r()*2-1)*q.R;y=(r()*2-1)*q.R}while(x*x+y*y>(0.8*q.R)**2);
    let th=r()*2*Math.PI;const idx=[];
    for(let k=0;k<q.nb;k++){
      idx.push(pts.length);pts.push({x,y});fibre.push(f);
      th+=q.turn*gauss(r);
      let nx=x+q.s*Math.cos(th),ny=y+q.s*Math.sin(th);
      if(nx*nx+ny*ny>(0.95*q.R)**2){th=Math.atan2(-y,-x)+0.8*gauss(r);nx=x+q.s*Math.cos(th);ny=y+q.s*Math.sin(th)}
      x=nx;y=ny;
    }
    fibIdx.push(idx);
  }
  const b=newBody('cot',pts,fibre),L=[],T=[];
  for(const idx of fibIdx){
    for(let k=0;k+1<idx.length;k++){const i=idx[k],j=idx[k+1];L.push({i,j,l0:Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y),type:1,k:q.kax})}
    for(let k=1;k+1<idx.length;k++){const i=idx[k-1],j=idx[k],l=idx[k+1];T.push([i,j,l,turnAngle(pts[i].x,pts[i].y,pts[j].x,pts[j].y,pts[l].x,pts[l].y)])}
  }
  // junctions: wherever two fibres (or two far-apart parts of one fibre) start within jr of each other
  const a=q.kj/(4*q.Fj),D=2*q.Fj/a;   // Morse with stiffness 2Da^2 = kj and largest pull Da/2 = Fj
  for(let i=0;i<pts.length;i++)for(let j=i+1;j<pts.length;j++){
    if(fibre[i]===fibre[j]&&j-i<4)continue;
    const d=Math.hypot(pts[i].x-pts[j].x,pts[i].y-pts[j].y);
    if(d<q.jr)L.push({i,j,l0:d,type:2,D,al:a,brk:d+3*Math.log(2)/a});
  }
  packBonds(b,L);b.c=q.c;b.nj=L.filter(s=>s.type===2).length;
  b.ntri=T.length;b.ti=new Int32Array(T.map(t=>t[0]));b.tj=new Int32Array(T.map(t=>t[1]));b.tk=new Int32Array(T.map(t=>t[2]));b.th0=new Float64Array(T.map(t=>t[3]));
  b.cell=new Int32Array(pts.length);b.next=new Int32Array(pts.length);b.fibIdx=fibIdx;
  relax(b);
  return b;
}
function relax(b){          // let the freshly made tangle settle without gravity, then call that shape 'unstressed'
  const g=P.g;P.g=0;const y0=Array.from(b.y),x0=Array.from(b.x);
  for(let round=0;round<3;round++){
    for(let k=0;k<400;k++){sub(b,P.dt);for(let i=0;i<b.N;i++){b.u[i]*=0.9;b.v[i]*=0.9}}
    for(let q=0;q<b.nb;q++){const i=b.bi[q],j=b.bj[q];b.l0[q]=Math.hypot(b.x[j]-b.x[i],b.y[j]-b.y[i]);if(b.type[q]===2)b.brk[q]=b.l0[q]+3*Math.log(2)/b.al[q]}
    for(let q=0;q<b.ntri;q++){const I=b.ti[q],J=b.tj[q],K=b.tk[q];b.th0[q]=turnAngle(b.x[I],b.y[I],b.x[J],b.y[J],b.x[K],b.y[K])}
  }
  P.g=g;
  // put it back at the drop height, at rest, and start the energy books from zero
  let ymin=Infinity;for(let i=0;i<b.N;i++)ymin=Math.min(ymin,b.y[i]);
  const shift=P.h+b.rad-ymin;let yc=0;
  for(let i=0;i<b.N;i++){b.y[i]+=shift;b.u[i]=0;b.v[i]=0;yc+=b.y[i]}
  b.y00=yc/b.N-P.h;b.heat=0;b.heatBall=0;b.heatHead=0;b.yp=0;b.vp=0;b.t=0;b.tImpact=null;
}
function bondForces(b){
  const {x,y,u,v,fx,fy}=b;let Eb=0;
  for(let q=0;q<b.nb;q++){
    if(!b.alive[q])continue;
    const i=b.bi[q],j=b.bj[q],dx=x[j]-x[i],dy=y[j]-y[i],l=Math.sqrt(dx*dx+dy*dy)||1e-12,ex=dx/l,ey=dy/l;
    if(l>b.brk[q]){b.alive[q]=0;continue}
    let f;
    if(b.type[q]===1)f=b.k[q]*(l-b.l0[q]);                                  // fibre axis: Hooke
    else{const e=Math.exp(-b.al[q]*(l-b.l0[q]));f=2*b.D[q]*b.al[q]*e*(1-e)}  // Morse: f = dU/dr
    const vr=(u[j]-u[i])*ex+(v[j]-v[i])*ey;
    const fd=(b.type[q]===2?0.2:1)*b.c*vr;f+=fd;b.Pd+=fd*vr;   // damper power -> heat
    if(b.type[q]===1)Eb+=0.5*b.k[q]*(l-b.l0[q])**2;else{const e=Math.exp(-b.al[q]*(l-b.l0[q]));Eb+=b.D[q]*(1-e)*(1-e)}
    b.strain[q]=(l-b.l0[q])/b.l0[q];
    fx[i]+=f*ex;fy[i]+=f*ey;fx[j]-=f*ex;fy[j]-=f*ey;
  }
  b.Ebond=Eb;
}
function bendForces(b){
  const {x,y,u,v,fx,fy}=b,kb=P.cot.kb,cb=P.cot.cb;let Ebend=0;
  for(let q=0;q<b.ntri;q++){
    const I=b.ti[q],J=b.tj[q],K=b.tk[q];
    const ux=x[J]-x[I],uy=y[J]-y[I],vx=x[K]-x[J],vy=y[K]-y[J],u2=ux*ux+uy*uy,v2=vx*vx+vy*vy;
    let d=Math.atan2(ux*vy-uy*vx,ux*vx+uy*vy)-b.th0[q];d=Math.atan2(Math.sin(d),Math.cos(d));
    const gix=-uy/u2,giy=ux/u2,gkx=-vy/v2,gky=vx/v2;               // gradient of the turning angle
    const om=gix*u[I]+giy*v[I]+gkx*u[K]+gky*v[K]-(gix+gkx)*u[J]-(giy+gky)*v[J];
    const T=-kb*d-cb*om;                                            // elastic + frictional bending moment
    Ebend+=0.5*kb*d*d;b.Pd+=cb*om*om;
    fx[I]+=T*gix;fy[I]+=T*giy;fx[K]+=T*gkx;fy[K]+=T*gky;fx[J]-=T*(gix+gkx);fy[J]-=T*(giy+gky);
  }
  b.Ebend=Ebend;
}
function contactForces(b){                 // fibres touching fibres: soft repulsion with friction
  const q=P.cot,h=q.drep,{x,y,u,v,fx,fy,fib}=b,N=b.N;
  let GX0=Infinity,GY0=Infinity,x1=-Infinity,y1=-Infinity;   // grid around the ball, cell size = contact range
  for(let i=0;i<N;i++){if(x[i]<GX0)GX0=x[i];if(x[i]>x1)x1=x[i];if(y[i]<GY0)GY0=y[i];if(y[i]>y1)y1=y[i]}
  const nx=Math.floor((x1-GX0)/h)+1,ny=Math.floor((y1-GY0)/h)+1;
  if(!b.headArr||b.headArr.length<nx*ny)b.headArr=new Int32Array(nx*ny*2);
  const head=b.headArr;head.fill(-1,0,nx*ny);
  for(let i=0;i<N;i++){
    const cx=Math.min(nx-1,Math.max(0,Math.floor((x[i]-GX0)/h))),cy=Math.min(ny-1,Math.max(0,Math.floor((y[i]-GY0)/h)));
    const c=cx*ny+cy;b.cell[i]=c;b.next[i]=head[c];head[c]=i;
  }
  let Erep=0;
  for(let i=0;i<N;i++){
    const c=b.cell[i],cx=(c/ny)|0,cy=c-cx*ny;
    for(let ox=-1;ox<=1;ox++){const X=cx+ox;if(X<0||X>=nx)continue;
      for(let oy=-1;oy<=1;oy++){const Y=cy+oy;if(Y<0||Y>=ny)continue;
        for(let j=head[X*ny+Y];j!==-1;j=b.next[j]){
          if(j<=i||(fib[i]===fib[j]&&j-i<3))continue;
          const dx=x[j]-x[i],dy=y[j]-y[i],r2=dx*dx+dy*dy;
          if(r2>=h*h)continue;
          const r=Math.sqrt(r2)||1e-12,ex=dx/r,ey=dy/r,vr=(u[j]-u[i])*ex+(v[j]-v[i])*ey;
          const fe=-q.krep*(h-r),f=Math.min(0,fe+q.crep*vr);
          Erep+=0.5*q.krep*(h-r)*(h-r);
          b.Pd+=(f-fe)*vr;                  // power lost to contact friction (f-fe is the friction part)
          fx[i]+=f*ex;fy[i]+=f*ey;fx[j]-=f*ex;fy[j]-=f*ey;
        }}}
  }
  b.Erep=Erep;
}
function sub(b,dt){
  const H=P.head,{x,y,u,v,fx,fy}=b,N=b.N,m=b.m;
  for(let i=0;i<N;i++){fx[i]=0;fy[i]=-m*P.g}                      // Newton: weight on every particle
  b.Pd=0;b.Pdh=0;b.Ebend=0;b.Erep=0;
  bondForces(b);
  if(b.kind==='cot'){bendForces(b);contactForces(b)}
  let Fc=0,Ec=0;
  for(let i=0;i<N;i++){                                              // particle on plate: stiff spring, damped, never pulls
    const pen=b.yp-(y[i]-b.rad);
    if(pen>0){const fe=b.kc*pen,f=Math.max(0,fe-b.cc*(v[i]-b.vp));fy[i]+=f;Fc+=f;Ec+=0.5*b.kc*pen*pen;b.Pdh+=(fe-f)*(b.vp-v[i])*-1}
  }
  b.Pdh+=H.ch*b.vp*b.vp;                                             // head damper (soft tissue)
  for(let i=0;i<N;i++){u[i]+=fx[i]/m*dt;v[i]+=fy[i]/m*dt;x[i]+=u[i]*dt;y[i]+=v[i]*dt} // semi-implicit Euler
  const ap=(-Fc-H.kh*b.yp-H.ch*b.vp)/H.mp;b.vp+=ap*dt;b.yp+=b.vp*dt;  // plate: m_p a = -F_contact - k_h y - c_h v
  b.heatBall+=b.Pd*dt;b.heatHead+=b.Pdh*dt;b.heat=b.heatBall+b.heatHead;
  b.t+=dt;
  let KE=0,PE=0;for(let i=0;i<N;i++){KE+=0.5*m*(u[i]*u[i]+v[i]*v[i]);PE+=m*P.g*(y[i]-b.y00)}
  b.E={KE,PE,heatBall:b.heatBall,heatHead:b.heatHead,elastic:b.Ebond+b.Ebend+b.Erep+Ec,head:0.5*H.kh*b.yp*b.yp+0.5*H.mp*b.vp*b.vp,heat:b.heat};
  if(b.tImpact===null&&Fc>0)b.tImpact=b.t;
}
function step(b){                                                    // one frame step of length P.dt (iron: in 'sub' smaller steps, its bonds are stiff)
  const n=b.kind==='iron'?P.iron.sub:P.cot.sub;
  for(let s=0;s<n;s++)sub(b,P.dt/n);
  const Fs=-P.head.kh*b.yp;                                          // the scale reads its spring: F = k_h * compression
  if(Fs>b.Fmax)b.Fmax=Fs;
  return Fs;
}
/*PHYSICS-END*/

const T={"title_tag": "Iron, Cotton and the Head", "eyebrow": "Newton · Morse · Hooke · an interactive study", "title": "Why an iron ball hurts and a cotton ball does not", "lede": "Two balls of the same mass fall from the same height onto a head, drawn as a plate on a spring and a damper. The iron ball is a lattice of atoms joined by stiff bonds. The cotton ball is a tangle of thin fibres that bend, cling where they cross and rub on each other. The model runs once when the page opens and every curve and number on this page comes from it; the text below derives what the model does and compares it with real iron, real cotton and a real skull.", "replay": "Drop again", "drop": "Drop", "dropping": "Falling…", "startline": "start: 10 m above the head", "open1": "Both balls are held 10 m above the head.", "open2": "Press “Drop” below to let them fall.", "open2wait": "Computing the drop: {p} %. You can press “Drop” already.", "computing": "computing", "speed1": "Real time", "speed4": "Slow ×4", "speed20": "Slow ×20", "clock": "Simulated time", "iron": "Iron", "cotton": "Cotton", "head": "head: plate, spring, damper", "gain": "plate travel drawn 10× larger", "scale": "scale", "lcd_peak": "PEAK", "lcd_now": "NOW", "lcd_w": "WEIGHT", "plot_title": "What the scale reads", "plot_note": "Left: the moment of impact, stretched out. Right: the whole run. The dashed green line is the weight of either ball, Mg = 9.81 N. The iron curve is a tall, narrow spike; the cotton curve is a low, wide hump. After the shaking stops, both settle on the same line.", "plot_zoom": "Around the impact (0.4 s)", "plot_all": "Whole run, 0 to 9 s", "ax_t": "time (s)", "ax_f": "force (N)", "weightline": "weight Mg", "energy_title": "Where the energy goes", "energy_note": "The upper bar of each pair is the energy the fall has handed over so far: the height energy the ball has lost. The lower bar shows where that energy is now. If energy is conserved, the two bars are equally long; the line under them gives the difference in joules, which is the integrator’s own error.", "en_in": "given by the fall", "en_out": "where it is now", "en_books": "books", "en_diff": "difference", "en_ke": "motion", "en_el": "stored in the ball", "en_head": "stored in the head spring", "en_heatball": "heat in the ball", "en_heathead": "heat in the head", "r_contact": "first touch at", "r_pred": "Newton predicts √(2h/g) =", "r_peak": "impact force (peak)", "r_kg": "what a kitchen scale would show for that instant (F/g)", "r_weight": "weight after it settles", "r_mass": "mass", "headnote": "Each scale is the head itself: plate, spring and damper. Plate travel drawn 10× larger.", "r_settling": "still shaking…", "r_heatball": "heat made inside the ball", "r_heathead": "heat made in the head", "sections": "\n<div class=\"card\">\n<h2><span class=\"num\">1</span>The answer in one sentence</h2>\n<p>A falling ball hurts because of how <em>short</em> a distance it takes to stop it. Both balls bring about the same energy (in the model, exactly the same). The iron ball does not give way, so the head has to stop it within the few millimetres a skull can yield, and a short stop needs a large force. The cotton ball gives way itself: it is stopped over a large part of its own size, and most of its energy turns into heat inside the cotton, not in the head.</p>\n<div class=\"box pic\"><div class=\"tag\">Picture</div><p>Catch a raw egg with stiff hands and it breaks; let your hands travel back with it over 30 cm and it survives. The egg brings the same energy both times. Only the stopping distance changed.</p></div>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">2</span>The fall: Newton's second law</h2>\n<div class=\"box pic\"><div class=\"tag\">Picture</div><p>Drop a key and a ball of wool from a chair at the same moment: they land together. Gravity pulls every gram equally, and every gram has the same inertia to overcome, so in a vacuum everything falls alike.</p></div>\n<p>Each ball is a set of particles with masses <span class=\"m\">m<sub>i</sub></span>. Newton's second law holds for every one of them: mass times acceleration equals the sum of the forces on it. While the ball falls, nothing touches it and its bonds are relaxed, so only the weight acts:</p>\n<div class=\"eq\">m<sub>i</sub> ÿ<sub>i</sub> = − m<sub>i</sub> g &nbsp;&nbsp;⇒&nbsp;&nbsp; ÿ = − g</div>\n<p>The mass cancels. Start at rest at height <span class=\"m\">h</span> (measured from the plate to the lowest point of the ball) and integrate once, then once more:</p>\n<div class=\"eq\">v(t) = − g t, &nbsp;&nbsp; y(t) = h − ½ g t²</div>\n<p>The ball reaches the plate when <span class=\"m\">y = 0</span>:</p>\n<div class=\"eq key\">t* = √(2h/g), &nbsp;&nbsp; v* = g t* = √(2gh)</div>\n<div class=\"box chk\"><div class=\"tag\">Check</div><p>Units: √(m / (m/s²)) = s. Energy gives the same speed without mentioning time: the height energy <span class=\"m\">Mgh</span> becomes motion energy <span class=\"m\">½Mv*²</span>, so <span class=\"m\">v* = √(2gh)</span>.</p></div>\n<div class=\"box toy\"><div class=\"tag\">In our model</div><p>With <span class=\"m\">h = 10 m</span>: <span class=\"m\">t* = 1.428 s</span> and <span class=\"m\">v* = 14.0 m/s</span>. The model integrates the particles step by step and records the first touch; the readout above lets you compare it with the formula. The model leaves out air, so both balls arrive with the same speed and the comparison isolates the material.</p></div>\n<h3>With air, for real balls</h3>\n<p>A real ball also feels air drag, <span class=\"m\">½ ρ<sub>air</sub> C<sub>d</sub> A v²</span>, where <span class=\"m\">A</span> is its cross-section and <span class=\"m\">C<sub>d</sub> ≈ 0.47</span> for a sphere. Take <span class=\"m\">y</span> as the distance fallen, write the acceleration as <span class=\"m\">dv/dt = v dv/dy = ½ d(v²)/dy</span>, and define the terminal speed <span class=\"m\">v<sub>t</sub> = √(2mg / (ρ<sub>air</sub> C<sub>d</sub> A))</span>, at which drag equals weight:</p>\n<div class=\"eq\">½ d(v²)/dy = g (1 − v²/v<sub>t</sub>²) &nbsp;&nbsp;⇒&nbsp;&nbsp; v² = v<sub>t</sub>² (1 − e<sup>−2gy/v<sub>t</sub>²</sup>)</div>\n<div class=\"box chk\"><div class=\"tag\">Check</div><p>For a short fall, <span class=\"m\">e<sup>−x</sup> ≈ 1 − x</span> gives back <span class=\"m\">v² = 2gy</span>, the vacuum result.</p></div>\n<p>For a 0.5 kg ball dropped 10 m: solid iron (4.96 cm across) has <span class=\"m\">v<sub>t</sub> = 95 m/s</span> and arrives at 13.9 m/s, almost the vacuum value of 14.0 m/s. A ball of loose cotton wool of the same mass (density about 30 kg/m³, so 31.7 cm across) has <span class=\"m\">v<sub>t</sub> = 14.8 m/s</span> and arrives at 11.4 m/s. Air slows the cotton a little; it is not the main reason it is harmless.</p>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">3</span>The bonds: what holds a solid together</h2>\n<div class=\"box pic\"><div class=\"tag\">Picture</div><p>Think of a marble in a valley. One side of the valley is a steep wall, the other a long gentle slope that flattens into a plain. Nudge the marble and it rocks back and forth at the bottom. Push it towards the wall and it is thrown back hard. Push it up the gentle side hard enough and it rolls over the rim and away: the bond is broken. The marble is one atom, the bottom of the valley is its resting distance from its neighbour, and the shape of the valley is the bond.</p></div>\n<p>Two atoms at distance <span class=\"m\">r</span> have an energy <span class=\"m\">U(r)</span>. The force on each, along the line joining them, is <span class=\"m\">F = −dU/dr</span>. At the bottom of the valley, <span class=\"m\">r = r<sub>0</sub></span>, the force is zero and the atoms rest. Expand around that point. The first derivative vanishes at a minimum, so</p>\n<div class=\"eq\">U(r) ≈ U(r<sub>0</sub>) + ½ U″(r<sub>0</sub>) (r − r<sub>0</sub>)² &nbsp;&nbsp;⇒&nbsp;&nbsp; F ≈ − k (r − r<sub>0</sub>), &nbsp; k = U″(r<sub>0</sub>)</div>\n<p>Near rest, every bond is a Hooke spring. This is why springs appear everywhere in mechanics: any smooth valley looks like a parabola at its bottom.</p>\n<h3>The Morse bond</h3>\n<p>Philip Morse proposed in 1929 a valley with exactly the shape of the picture:</p>\n<div class=\"eq key\">U(r) = D [1 − e<sup>−α(r − r<sub>0</sub>)</sup>]²</div>\n<p><span class=\"m\">D</span> is the depth of the valley, the energy needed to pull the two atoms apart for good, and <span class=\"m\">1/α</span> is its width. Expanding <span class=\"m\">1 − e<sup>−αx</sup> ≈ αx</span> gives the spring constant <span class=\"m\">k = 2Dα²</span>. The pull of the bond, <span class=\"m\">dU/dr = 2Dα e<sup>−αx</sup>(1 − e<sup>−αx</sup>)</span>, is largest where <span class=\"m\">e<sup>−αx</sup> = ½</span>, at a stretch <span class=\"m\">x = ln 2 / α</span>, and there it equals <span class=\"m\">Dα/2</span>. Stretch further and the bond pulls back <em>less</em>: it is letting go.</p>\n<p>Girifalco and Weizer fitted Morse valleys to cubic metals in 1959, using each metal's cohesive energy, lattice spacing and compressibility. For iron they give <span class=\"m\">D = 0.4174 eV</span>, <span class=\"m\">α = 1.3885 Å⁻¹</span>, <span class=\"m\">r<sub>0</sub> = 2.845 Å</span> (an electronvolt is 1.602×10⁻¹⁹ J, an ångström is 10⁻¹⁰ m). Then</p>\n<div class=\"eq\">k = 2Dα² = 1.61 eV/Å² = 25.8 N/m</div>\n<p>One bond is a soft spring: a weight of 2.6 g would stretch it by a millimetre. A solid is strong because it has an enormous number of them. Stack such springs in a simple cubic pattern: every square metre of cross-section holds <span class=\"m\">1/r<sub>0</sub>²</span> parallel bonds, and each layer is <span class=\"m\">r<sub>0</sub></span> thick, so the stress per unit strain is</p>\n<div class=\"eq\">E ≈ k / r<sub>0</sub> = 25.8 N/m ÷ 2.845×10⁻¹⁰ m ≈ 9×10¹⁰ Pa = 90 GPa</div>\n<p>Measured iron has a Young's modulus of about 210 GPa. A crude stack of pair springs gets the order of magnitude right; the real lattice geometry and the many-body nature of metallic bonding make up the rest.</p>\n<div class=\"box note\"><div class=\"tag\">Honest note: metals are not really pair-bonded</div><p>In a metal the outer electrons are shared by all atoms, so how strongly an atom binds a neighbour depends on how many other neighbours it already has. A pair potential cannot express that, and it shows: in an unstressed cubic crystal held together by central pair forces, two of the elastic constants must be equal (the Cauchy relation <span class=\"m\">C<sub>12</sub> = C<sub>44</sub></span>), and real metals break that rule. The embedded-atom method of Daw and Baskes (1984) fixes it. Each atom sits in the electron density <span class=\"m\">ρ̄<sub>i</sub> = Σ<sub>j</sub> f(r<sub>ij</sub>)</span> made by its neighbours and pays an embedding energy <span class=\"m\">F(ρ̄<sub>i</sub>)</span> for it: <span class=\"m\">E = Σ<sub>i</sub> F(ρ̄<sub>i</sub>) + ½ Σ<sub>i≠j</sub> φ(r<sub>ij</sub>)</span>. For the small elastic squeeze of our question, every one of these models reduces to springs near rest, so the Morse bond is enough here.</p></div>\n<div class=\"box toy\"><div class=\"tag\">In our model: iron</div><p>91 atoms on a triangular lattice, each bonded to its nearest neighbours by a Morse valley with <span class=\"m\">αr<sub>0</sub> = 3.95</span>, the same shape as iron's (1.3885 × 2.845). The stiffness is set so that the ball is much stiffer than the head, as a real iron ball is: its stiffness is of order <span class=\"m\">E·r ≈ 210 GPa × 2.5 cm ≈ 5×10⁹ N/m</span>, about a thousand times a skull's.</p></div>\n\n<h3>Cotton: stiff fibres, soft tangle</h3>\n<div class=\"box pic\"><div class=\"tag\">Picture</div><p>Push a dry spaghetti strand along its length and it resists. Push its middle sideways and it bends at once. Cotton is a loose tangle of such strands, and any push on the tangle ends up bending strands.</p></div>\n<p>A cotton fibre is cellulose: glucose rings joined by strong covalent bonds into long chains, the chains packed side by side and held together by hydrogen bonds into fibrils, and the fibrils wound into a twisted, partly hollow fibre roughly 15 µm wide. As a material it is stiff, with a Young's modulus of several gigapascals. The softness of a cotton ball does not come from weak molecules. It comes from geometry.</p>\n<p>Treat a fibre segment of length <span class=\"m\">L</span> and diameter <span class=\"m\">d</span> as a beam. Stretching it, its stiffness is <span class=\"m\">k<sub>stretch</sub> = EA/L</span> with <span class=\"m\">A = πd²/4</span>. Bending it like a diving board clamped at one end, the tip stiffness is <span class=\"m\">k<sub>bend</sub> = 3EI/L³</span> with <span class=\"m\">I = πd⁴/64</span>, the second moment of area, which measures how much material sits far from the bending line. Their ratio is</p>\n<div class=\"eq key\">k<sub>bend</sub> / k<sub>stretch</sub> = (3/16) (d/L)²</div>\n<p>For <span class=\"m\">d = 15 µm</span> and <span class=\"m\">L = 1 mm</span> between contacts this is <span class=\"m\">4×10⁻⁵</span>: bending is about 24 000 times softer than stretching. Thin things bend.</p>\n<h3>Why a tangle stiffens as you squeeze it</h3>\n<p>Let <span class=\"m\">φ</span> be the volume fraction, the share of the ball's volume taken by fibre. For loose cotton wool <span class=\"m\">φ ≈ 30/1520 ≈ 0.02</span>: the ball is 98 % air. The scaling argument below drops all numerical factors.</p>\n<p>First, how far apart are the contacts along a fibre? A piece of fibre of length <span class=\"m\">b</span> brushes past a slab of area about <span class=\"m\">b·d</span>. Other fibres fill a fraction <span class=\"m\">φ</span> of space, so roughly <span class=\"m\">φ b d / d² = φ b/d</span> of them cross that slab. One contact per piece means <span class=\"m\">b ≈ d/φ</span>: the denser the tangle, the closer the contacts. Compress the ball by a small strain <span class=\"m\">ε</span>. Each free segment of length <span class=\"m\">b</span> bends by <span class=\"m\">δ ≈ εb</span> and pushes back with</p>\n<div class=\"eq\">f ≈ (E d⁴ / b³) · ε b = E d⁴ ε / b²</div>\n<p>The fibre length per unit volume is <span class=\"m\">4φ/(πd²)</span>, so a layer one segment thick contains about <span class=\"m\">φ/d²</span> load-carrying segments per unit area. The stress is force per segment times segments per area:</p>\n<div class=\"eq\">σ ≈ (E d⁴ ε / b²) · (φ / d²) = E φ d² ε / b² = E φ³ ε</div>\n<p>So the tangle's stiffness is about <span class=\"m\">E φ³</span>. Because <span class=\"m\">φ</span> rises as you squeeze, so does the stiffness. Integrating with <span class=\"m\">dε = dφ/φ</span> gives van Wyk's law for fibre masses, first measured on wool in 1946:</p>\n<div class=\"eq key\">σ = K E (φ³ − φ<sub>0</sub>³)</div>\n<div class=\"box chk\"><div class=\"tag\">Check</div><p>With <span class=\"m\">φ = 0.02</span>, <span class=\"m\">φ³ = 8×10⁻⁶</span>: the tangle is at least a hundred thousand times softer than the fibre it is made of. And the law says a squashed ball is harder to squash further, which your fingers confirm on any cotton ball.</p></div>\n<div class=\"box toy\"><div class=\"tag\">In our model: cotton</div><p>18 fibres of 34 beads each, curled at random inside a circle. Four ingredients act on them. Stretch springs along each fibre. Bending springs on the angle between successive segments, whose rest angles are the fibre's natural curl. Junctions where fibres cross, made of shallow Morse valleys that can break, standing in for friction and entanglement. Finally, when beads of different fibres touch they push apart and rub, with friction. New contacts forming under the squeeze give the van Wyk stiffening, and the rubbing turns motion into heat.</p></div>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">4</span>The hit: why stiff hurts</h2>\n<p>When something stops the ball over a distance <span class=\"m\">d</span>, the stopping force does work against its motion. The work–energy theorem says this work equals the motion energy removed:</p>\n<div class=\"eq key\">F̄ · d = ½ m v²</div>\n<p>where <span class=\"m\">F̄</span> is the force averaged over the distance. Same energy, ten times shorter stop, ten times larger force.</p>\n<h3>Iron: the head does all the yielding</h3>\n<p>Assume the ball is rigid (section 3 showed that a real iron ball is about a thousand times stiffer than a skull), the head is a linear spring of stiffness <span class=\"m\">k<sub>h</sub></span>, and nothing is lost on the way in. A linear spring is a simplification: measured skulls stiffen as they are pressed further. The motion energy goes into the spring: <span class=\"m\">½mv² = ½k<sub>h</sub>x<sub>max</sub>²</span>. Hence</p>\n<div class=\"eq key\">x<sub>max</sub> = v √(m/k<sub>h</sub>), &nbsp;&nbsp; F<sub>max</sub> = k<sub>h</sub> x<sub>max</sub> = v √(m k<sub>h</sub>), &nbsp;&nbsp; τ = π √(m/k<sub>h</sub>)</div>\n<p>The contact lasts <span class=\"m\">τ</span>, half an oscillation of the mass on the spring.</p>\n<div class=\"box chk\"><div class=\"tag\">Check</div><p>Units: <span class=\"m\">(m/s)·√(kg·N/m) = (m/s)·(kg/s) = N</span>. Limit: a softer head (<span class=\"m\">k<sub>h</sub> → 0</span>) gives a gentler, longer push, as a pillow does.</p></div>\n<p>A real head is not bolted down. During a millisecond the neck hardly acts, so the ball compresses the spring between itself and a free head of mass <span class=\"m\">M<sub>h</sub></span>, and <span class=\"m\">m</span> above is replaced by the reduced mass <span class=\"m\">μ = mM<sub>h</sub>/(m + M<sub>h</sub>)</span>. In words: the head recoils a little, so the spring between them is squeezed a little less.</p>\n<div class=\"box toy\"><div class=\"tag\">Real numbers</div><p>For the 0.5 kg iron ball at 13.9 m/s, and a mean dynamic skull stiffness of about 4.0 MN/m (measured by Yoganandan and co-workers on cadaver heads): <span class=\"m\">F<sub>max</sub> = 19.8 kN</span> over <span class=\"m\">τ = 1.1 ms</span>, with the skull yielding <span class=\"m\">x<sub>max</sub> = 4.9 mm</span>. With a free head of about 4.5 kg (an assumed typical value), <span class=\"m\">μ = 0.45 kg</span> and the peak drops to about 18.7 kN. The same study measured a mean dynamic failure load of 11.9 kN. The head's acceleration, <span class=\"m\">F/M<sub>h</sub></span>, is about 4200 m/s², over 400 times gravity.</p></div>\n<h3>Cotton: the ball does the yielding</h3>\n<p>The cotton ball is far softer than the head, so the head barely moves and the ball crushes instead, over a good part of its 32 cm. Take a stopping distance of about 20 cm (my estimate, not a measurement): <span class=\"m\">F̄ ≈ 32.5 J / 0.2 m ≈ 160 N</span>, an acceleration of the head of under 4 times gravity. That average is about 120 times below the iron's peak. The cotton's own peak lies above its average, because the tangle stiffens as it is squashed. By how much I could not pin down: a one-dimensional estimate of my own kept falling as I refined it, from 4.7 kN to 0.83 kN, and had not settled.</p>\n<h3>The decisive test: a solid cellulose ball</h3>\n<p>A solid ball of cellulose, the very molecule cotton is made of, is about a thousand times stiffer than a skull, just as iron is. In my one-dimensional model it hit with 19.5 kN, against 19.8 kN for iron. So the chemistry of the bonds does not decide the outcome. Their arrangement does.</p>\n<div class=\"box note\"><div class=\"tag\">A second picture: how fast the news travels</div><p>When the front of a ball stops, the back learns of it through a compression wave. In iron that wave runs at <span class=\"m\">√(E/ρ) ≈ 5.2 km/s</span> and crosses the 5 cm ball in about 10 µs, a hundred times faster than the contact lasts, so the whole ball stops as one body, like a hailstone. In loose cotton the wave runs at metres to tens of metres per second (I could not pin the number down), similar to the impact speed. The back of the ball keeps arriving after the front has stopped, so the cotton hits like a short shower of light pieces rather than like one stone.</p></div>\n<div class=\"box toy\"><div class=\"tag\">In our model</div><p>Here <span class=\"m\">v = 14.0 m/s</span>, <span class=\"m\">m = 1 kg</span> and <span class=\"m\">k<sub>h</sub> = 6000 N/m</span>, so the rigid-ball formula gives 1085 N. The model reads about 639 N, lower, because the head's damper and the soft contact between atoms and plate both cushion the peak. The cotton peaks near 188 N. The ratio in the model is about 3.4, far below the real one, because I had to keep the toy cotton much stiffer than real cotton for it to stay a visible ball.</p></div>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">5</span>The scale: how force sensors work</h2>\n<div class=\"box pic\"><div class=\"tag\">Picture</div><p>Stand at the end of a diving board and it bends; the heavier you are, the more it bends. Every scale is a diving board with a ruler. It measures how much something bends and turns that into a force.</p></div>\n<p>The scale in the animation is the head itself: a plate on a spring. It reads Hooke's law backwards, <span class=\"m\">F = k<sub>h</sub> × compression</span>. The black needle shows the force at this instant. The thin red pointer is a peak hold: the needle pushes it up and it stays at the largest force so far, which is the impact force. When the shaking has died away, the needle comes to rest where the spring holds the ball still, <span class=\"m\">k<sub>h</sub>x = Mg</span>, and the display switches to the weight. The cotton keeps swaying gently for a few seconds, so the scale does what a digital scale does with a noisy signal: it averages its reading, here from 4 s onward, and shows the result from 6.5 s. Both balls then read 9.81 N, which is 1.000 kg, because both are exactly 1 kg. Same weight, very different blows.</p>\n<p>A kitchen scale shows kilograms by dividing the force by <span class=\"m\">g</span>. So for the instant of impact the iron ball would read about 65 kg, the cotton ball about 19 kg, and both settle at 1 kg.</p>\n<h3>Inside a real kitchen or bathroom scale</h3>\n<p>Under the platform sits a load cell: a small aluminium block shaped so that it bends very slightly under load. Glued to it is a strain gauge, a thin metal foil laid out in a zigzag. When the block bends, the foil is stretched, becoming longer and thinner, and its electrical resistance <span class=\"m\">R = ρ<sub>e</sub>L/A</span> rises (here <span class=\"m\">ρ<sub>e</sub></span> is the metal's resistivity). For common foil alloys the relative change is about twice the strain, <span class=\"m\">ΔR/R ≈ 2ε</span>: a few tenths of a percent at most. To see such a small change, four resistors are wired in a diamond, a Wheatstone bridge, balanced so that it gives zero voltage with no load; any stretch unbalances it and a voltage appears. An amplifier measures it and the display divides by <span class=\"m\">g</span>.</p>\n<h3>Why a bathroom scale cannot read a blow</h3>\n<p>A scale is itself a mass on a spring. It can follow only forces that change slower than its own natural frequency <span class=\"m\">f<sub>0</sub> = (1/2π)√(k/m)</span>, the rate at which it rings when tapped; and its electronics average over a fraction of a second to show a steady number. A blow lasting a millisecond is over before the scale can respond.</p>\n<p>For impacts, engineers use piezoelectric force sensors. Squeeze a quartz crystal and its positive and negative ions shift slightly relative to each other inside the lattice, so its faces become electrically charged, about 2.3 pC per newton for quartz (a picocoulomb is 10⁻¹² C). The crystal is so stiff that it barely moves, so its natural frequency is tens of kilohertz and it can follow a millisecond blow. The charge comes from atoms displaced in their bond valleys, the same valleys as in section 3.</p>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">6</span>Where the energy goes</h2>\n<p>Energy is conserved, so the books must balance at every instant:</p>\n<div class=\"eq key\">height energy released = motion + stored in the ball + stored in the head spring + heat</div>\n<p>Heat is produced wherever something rubs or flows: in the dampers that stand for internal friction in the bonds, in fibres rubbing on fibres, in the head's damper (soft tissue) and in the contact between ball and plate. The model adds up each of these from its own law, so the two bars in the energy chart are computed independently and can disagree. They differ by a fraction of a joule, the numerical error of the time-stepping.</p>\n<div class=\"box toy\"><div class=\"tag\">In our model</div><p>The iron ball turns about 98 J into heat, almost all of it in the head. The cotton ball turns about 104 J into heat, almost all of it inside the cotton. It releases more than the 98.1 J of the drop because it ends up squashed lower than it started, so its centre of mass (the average position of its mass) falls further; it also starts with about 1.2 J stored in fibres that were pressed together when the tangle was made. That is the cotton's protection, in energy terms: it burns the blow inside itself.</p></div>\n</div>\n\n<div class=\"card\">\n<h2><span class=\"num\">7</span>What the model leaves out</h2>\n<p>It is two-dimensional, a slice through a three-dimensional ball. Air is left out, so both balls arrive at the same speed. The head is a flat plate on a spring and a damper, not a curved skull around a brain. The toy iron is stiffer than the head by a much smaller factor than real iron, and the toy cotton is much stiffer than real cotton, so the model shows the mechanism with a peak ratio of about 3.4, where the real ratio of iron's peak to cotton's average force is about 120. The fibres' contacts in the slice stand in for contacts in three dimensions. The real-world numbers in sections 2 and 4 come from separate hand calculations, whose inputs are listed in the table.</p>\n</div>\n", " function record(k){
  for(const s of BALLS){
    const b=body[s],d=D[s],N=b.N,o=k*N,e=b.E;
    for(let i=0;i<N;i++){d.x[o+i]=b.x[i];d.y[o+i]=b.y[i];d.sp[o+i]=Math.sqrt(b.u[i]*b.u[i]+b.v[i]*b.v[i])}
    d.yp[k]=b.yp;d.vp[k]=b.vp;d.F[k]=b.Fs;d.Fmax[k]=b.Fmax;
    d.KE[k]=e.KE;d.PE[k]=e.PE;d.El[k]=e.elastic;d.Eh[k]=e.head;d.Qb[k]=e.heatBall;d.Qh[k]=e.heatHead;
    d.Ein[k]=b.E0-d.PE[k];d.Esum[k]=d.KE[k]+d.El[k]+d.Eh[k]+d.Qb[k]+d.Qh[k];d.books[k]=d.Esum[k]-d.Ein[k];
    if(k>=KW0){wsum[s]+=d.F[k];wcnt[s]++;d.W[k]=wsum[s]/wcnt[s]}else d.W[k]=NaN;
    if(b.tImpact!==null&&!(ds.get("t_touch_"+s)>=0))ds.set("t_touch_"+s,b.tImpact);
    if(k%CK===0){const c=k/CK,ck=n=>ds.get("ck_"+n+"_"+s);
      ck("x").set(b.x,c*N);ck("y").set(b.y,c*N);ck("u").set(b.u,c*N);ck("v").set(b.v,c*N);ck("alive").set(b.alive,c*b.nb);
      ck("t")[c]=b.t;ck("yp")[c]=b.yp;ck("vp")[c]=b.vp;ck("Fmax")[c]=b.Fmax;ck("Qb")[c]=b.heatBall;ck("Qh")[c]=b.heatHead;ck("ti")[c]=b.tImpact===null?NaN:b.tImpact}
  }
  ds.get("nstep")[k]=steps;
  if(k%CK===0){ds.get("ck_n")[k/CK]=k;ds.get("ck_step")[k/CK]=steps}
}
const RUN=["nstep","ck_n","ck_step"];for(const s of BALLS)for(const q of ["x","y","sp","yp","vp","F","Fmax","KE","PE","El","Eh","Qb","Qh","Ein","Esum","books","W","ck_x","ck_y","ck_u","ck_v","ck_t","ck_yp","ck_vp","ck_Fmax","ck_Qb","ck_Qh","ck_ti","ck_alive"])RUN.push(q+"_"+s);
function init(){
  iron=makeIron();cot=makeCotton();body={iron:iron,cot:cot};
  declare();
  for(const s of BALLS){const b=body[s];b.Fs=step(b);const e=b.E;b.E0=e.KE+e.PE+e.elastic+e.head+e.heatBall+e.heatHead;ds.set("E0_"+s,b.E0)}
  steps=1;record(0);computed=1;ds.set("computed",1);ds.set("steps",steps);ds.set("done",false);
  tStart=performance.now();setTimeout(work,0);
}
function work(){
  const t0=performance.now();
  while(computed<NF&&performance.now()-t0<14){
    const target=tOf(computed);
    while(iron.t<target-1e-9){iron.Fs=step(iron);cot.Fs=step(cot);steps++}
    record(computed);computed++;
  }
  ds.set("computed",computed);ds.set("steps",steps);for(const n of RUN)ds.touch(n);
  if(computed<NF){setTimeout(work,0);return}
  ds.set("compute_ms",performance.now()-tStart);
  for(const s of BALLS){const d=D[s];let m=0;for(let k=0;k<NF;k++)m=Math.max(m,Math.abs(d.books[k]));
    ds.set("Fpeak_"+s,d.Fmax[NF-1]);ds.set("W_end_"+s,d.W[NF-1]);ds.set("w_rel_"+s,(d.W[NF-1]-ds.get("Mg"))/ds.get("Mg"));ds.set("books_max_"+s,m)}
  ds.set("done",true);
}

function readBack(box,what,pt,r,test,expected,note){

function partDrawn(s,idx){
  const N=D[s].N,n=Math.floor(idx/N),i=idx%N;

    :readBack(stageBox,"centre of cotton bead "+i,p,1,light,"the pale bead core","Drawn at x<sub>col</sub> + x·s, y<sub>bottom</sub> − (y + (G − 1) y<sub>p</sub> − y<sub>cam</sub>)·s; the fibre is a smooth curve through the beads.");

function plateRow(s){
  const top=ds.get("plate_px_"+s),bx=ds.get("bx_"+s),pw=Math.min(2.9*ds.get("sc"),ds.get("col_w")-14);
  if(top>ds.get("bottom_px")+18)return {what:"the "+NAME[s]+" plate",drawn:"below the scene",expected:"not drawn",ok:null,note:"The camera follows the iron ball; the plate is out of view."};
  let found=null;                               // scan whole device-pixel rows: Sim.readPixel reads device row round(y·dpr), so y = r/dpr reads row r
  for(const x of [bx-pw/2+5,bx+pw/2-5])for(let r=Math.floor((top-6)*DPR);r<=Math.ceil((top+12)*DPR);r++){const q=Sim.readPixel(stageBox,x,r/DPR,0);if(plateFill(q.rgba)){if(found===null||r<found.r)found={x,r};break}}
  // the 1.4 px outline is centred on the edge, so it ends at y_plate + 0.7; the row it ends in is a blend of outline and fill,
  // so the first row of pure fill is the next whole device row
  const expRow=Math.ceil((top+0.7)*DPR);
  return {what:"first device-pixel row of pure plate fill, scanned down two columns near the plate's ends",drawn:found?"row "+found.r+" ("+Sim.fmt(found.r/DPR,2)+" css px)":"no plate fill found",expected:"row "+expRow+" ("+Sim.fmt(expRow/DPR,2)+" css px), the first whole row under the outline that ends at y_plate + 0.7 = "+Sim.fmt(top+0.7,2)+" css px",

}

  nstep:n=>({formula:"the sub-steps Δt/5 added up again until the model time reaches t<sub>n</sub> − 10<sup>−9</sup> s",inputs:[I("t<sub>n</sub>",G("ts")[n],"s",3)],value:recount()[n]}),
  ck_n:c=>({formula:"c · Δn<sub>ck</sub>",inputs:[I("c",c,"",0),I("Δn<sub>ck</sub>",CK,"",0)],value:c*CK}),
  ck_step:c=>({formula:"the frame steps counted again up to sample c · Δn<sub>ck</sub>",inputs:[I("c",c,"",0)],value:recount()[c*CK]}),
  type_cot:q=>({formula:"bond kind in a fresh build",inputs:[I("bond",q,"",0)],value:fresh("cot").type[q]}),
  fibre_cot:i=>({formula:"fibre of each bead in a fresh build",inputs:[I("bead",i,"",0)],value:fresh("cot").fib[i]}),
  i_now:()=>({formula:"nearest stored sample to t<sub>play</sub>, at most n<sub>done</sub> − 1",inputs:[I("t<sub>play</sub>",G("t_play"),"s",4)],value:Math.min(G("computed")-1,kOf(G("t_play")))}),
  t_now:()=>({formula:"t<sub>n</sub> at n = n<sub>now</sub>",inputs:[I("n<sub>now</sub>",G("i_now"),"",0)],value:G("ts")[G("i_now")]}),
  slow:()=>({formula:"the speed button that is pressed",inputs:[],value:+({s1:1,s4:4,s20:20})[(document.querySelector(".bar button.on:not(#drop)")||{}).id]}),
  W_px:()=>({formula:"width of the canvas on your screen",inputs:[],value:cv.getBoundingClientRect().width}),
  HS_px:()=>({formula:"430 if W < 640 css px, else 470",inputs:[I("W",G("W_px"),"css px",1)],value:G("W_px")<640?430:470}),
  H_px:()=>({formula:"H<sub>scene</sub> + 214 (the gauge strip)",inputs:[I("H<sub>scene</sub>",G("HS_px"),"css px",0)],value:G("HS_px")+214}),
  dpr:()=>({formula:"window.devicePixelRatio",inputs:[],value:devicePixelRatio||1}),
  ruler_px:()=>({formula:"the constant RULER",inputs:[],value:RULER}),gain:()=>({formula:"the constant GAIN",inputs:[],value:GAIN}),gauge_FS:()=>({formula:"the constant FS",inputs:[],value:FS}),
  top_px:()=>({formula:"the constant 40 in drawSim()",inputs:[],value:40}),
  bottom_px:()=>({formula:"H<sub>scene</sub> − 6",inputs:[I("H<sub>scene</sub>",G("HS_px"),"css px",0)],value:G("HS_px")-6}),
  col_w:()=>({formula:"(W − w<sub>ruler</sub> − 6) / 2",inputs:[I("W",G("W_px"),"css px",2),I("w<sub>ruler</sub>",G("ruler_px"),"css px",0)],value:(G("W_px")-G("ruler_px")-6)/2}),
  sc:()=>({formula:"min((y<sub>bottom</sub> − y<sub>top</sub>) / 6.6 m, w<sub>col</sub> / 3.3 m)",inputs:[I("y<sub>bottom</sub>",G("bottom_px"),"css px",1),I("y<sub>top</sub>",G("top_px"),"css px",0),I("w<sub>col</sub>",G("col_w"),"css px",3)],value:Math.min((G("bottom_px")-G("top_px"))/6.6,G("col_w")/3.3)}),
  view_m:()=>({formula:"(y<sub>bottom</sub> − y<sub>top</sub>) / s",inputs:[I("s",G("sc"),"px/m",4)],value:(G("bottom_px")-G("top_px"))/G("sc")}),
  cam_y:()=>{const n=G("i_now"),y=D.iron.y,N=D.iron.N;let lo=Infinity;for(let i=0;i<N;i++)lo=Math.min(lo,y[n*N+i]);
    return {formula:"max(−2.3 m, lowest stored iron y<sub>i</sub> at n<sub>now</sub> − 0.42 h<sub>view</sub>)",inputs:[I("min y<sub>i</sub>",lo,"m"),I("h<sub>view</sub>",G("view_m"),"m",4)],value:Math.max(-2.3,lo-0.42*G("view_m"))}},
  gauge_R:()=>({formula:"min(58, 0.3 w<sub>col</sub>)",inputs:[I("w<sub>col</sub>",G("col_w"),"css px",3)],value:Math.min(58,G("col_w")*0.3)}),
  gauge_cy:()=>({formula:"H<sub>scene</sub> + 8 + R<sub>g</sub> + 8",inputs:[I("H<sub>scene</sub>",G("HS_px"),"css px",0),I("R<sub>g</sub>",G("gauge_R"),"css px",3)],value:G("HS_px")+8+G("gauge_R")+8})
});

const drawn={};
for(const s of BALLS)Object.assign(drawn,{
  ["x_"+s]:idx=>partDrawn(s,idx),["y_"+s]:idx=>partDrawn(s,idx),["sp_"+s]:idx=>partDrawn(s,idx),
  ["plate_px_"+s]:()=>plateRow(s),["yp_now_"+s]:()=>plateRow(s),["shift_"+s]:()=>plateRow(s),
  ["needle_"+s]:()=>needleBack(s),["F_now_"+s]:()=>needleBack(s),["peakneedle_"+s]:()=>peakBack(s),["Fmax_now_"+s]:()=>peakBack(s),
  ["F_"+s]:n=>curveBack(s,n),["yp_"+s]:n=>n===ds.get("i_now")?plateRow(s):{what:"plate at sample "+n,drawn:"not drawn now",expected:"drawn only while the playback shows sample "+n,ok:null,note:""}
});

// ---- what lies at a point of the figure ----
function probe(x,y){
  if(!(G("sc")>0))return null;
  const R=G("gauge_R"),gcy=G("gauge_cy"),HSp=G("HS_px"),k=G("i_now");
  for(const s of BALLS){const bx=G("bx_"+s),pwid=Math.min(G("col_w")-12,170),py=HSp+8+2*R+22,pw=Math.min(2.9*G("sc"),G("col_w")-14),pt=G("plate_px_"+s);
    if(Math.hypot(x-bx,y-gcy)<=R+5)return {what:"scale",s,part:"gauge"};
    if(Math.abs(x-bx)<=pwid/2&&y>=py&&y<=py+62)return {what:"scale",s,part:"panel"};
    if(Math.abs(x-bx)<=pw/2&&y>=pt-2&&y<=pt+12&&pt<G("bottom_px")+20)return {what:"scale",s,part:"plate"}}
  if(y<G("top_px")||y>G("bottom_px")+2)return null;
  let best=null,bd=9;
  for(const s of BALLS)for(let i=0;i<D[s].N;i++){const p=partXY(s,k,i),dd=Math.hypot(x-p.x,y-p.y);if(dd<bd){bd=dd;best={what:"part",s,i}}}
  return best;
}
function inspect(ref){
  const n=G("i_now"),s=ref.s,d=D[s],ts=G("ts");
  if(ref.what==="part"){const N=d.N,i=ref.i,idx=n*N+i,rows=[["n",n,"","i_now",null],["t",ts[n],"s","ts",n],["x",d.x[idx],"m","x_"+s,idx],["y",d.y[idx],"m","y_"+s,idx],["|v|",d.sp[idx],"m/s","sp_"+s,idx]];
    if(s==="cot")rows.push(["fibre",G("fibre_cot")[i],"","fibre_cot",i]);
    return {title:s==="iron"?"iron atom "+i:"cotton bead "+i+", fibre "+G("fibre_cot")[i],at:partXY(s,n,i),rows}}
  const bx=G("bx_"+s),R=G("gauge_R"),at=ref.part==="gauge"?{x:bx,y:G("gauge_cy")}:ref.part==="panel"?{x:bx,y:G("HS_px")+8+2*R+22+31}:{x:bx,y:G("plate_px_"+s)+5};
  return {title:"the scale under the "+NAME[s]+" ball ("+(ref.part==="gauge"?"its gauge":ref.part==="panel"?"its digital panel":"the plate")+")",at,
    rows:[["t",ts[n],"s","ts",n],["F",d.F[n],"N","F_"+s,n],["F<sub>peak</sub>",d.Fmax[n],"N","Fmax_"+s,n],["W",d.W[n],"N","W_"+s,n],["y<sub>p</sub>",d.yp[n],"m","yp_"+s,n],["θ<sub>needle</sub>",G("needle_"+s),"°","needle_"+s,null]]};
}
function locate(name,idx){
  const m=/^(x|y|sp)_(iron|cot)$/.exec(name);
  if(m){const N=D[m[2]].N;return Math.floor(idx/N)===G("i_now")?partXY(m[2],G("i_now"),idx%N):null}
  const q=/^(F|Fmax|W|yp|vp)_(iron|cot)$/.exec(name);
  if(q&&idx===G("i_now"))return q[1]==="yp"||q[1]==="vp"?{x:G("bx_"+q[2]),y:G("plate_px_"+q[2])+5}:{x:G("bx_"+q[2]),y:G("gauge_cy")};
  const r=/^(F_now|Fmax_now|needle|peakneedle|W_now|kgpeak_now|kgw_now)_(iron|cot)$/.exec(name);if(r)return {x:G("bx_"+r[2]),y:G("gauge_cy")};
  const p=/^(yp_now|plate_px|shift)_(iron|cot)$/.exec(name);if(p)return {x:G("bx_"+p[2]),y:G("plate_px_"+p[2])+5};
  return null;
}

const ball=s=>["x_"+s,"y_"+s,"sp_"+s,"yp_"+s,"vp_"+s,"F_"+s,"Fmax_"+s,"W_"+s,"KE_"+s,"PE_"+s,"El_"+s,"Eh_"+s,"Qb_"+s,"Qh_"+s,"Ein_"+s,"Esum_"+s,"books_"+s];
const cks=s=>["ck_x_"+s,"ck_y_"+s,"ck_u_"+s,"ck_v_"+s,"ck_t_"+s,"ck_yp_"+s,"ck_vp_"+s,"ck_Fmax_"+s,"ck_Qb_"+s,"ck_Qh_"+s,"ck_ti_"+s,"ck_alive_"+s];
const both=f=>BALLS.map(f).flat();
Sim.data={
  ds:ds,kicker:"Portfolios 04 · data",file:"impact-iron-cotton",
  playing:()=>playing,play:startDrop,
  groups:[
    {title:"Parameters",note:"the constants of the model, P",vars:Object.keys(PMAP)},
    {title:"Derived physics",note:"computed once, when the two balls are built",vars:["N_iron","N_cot","m_iron","m_cot","nbond_iron","nbond_cot","alpha_iron","D_iron","nj_cot","ntri_cot","aj_cot","Dj_cot","kc_iron","cc_iron","kc_cot","cc_cot","y00_iron","y00_cot","E0_iron","E0_cot","t_star","v_star","Mg"]},
    {title:"Solver",note:"how the run is computed and stored",vars:["NF","CK","computed","steps","compute_ms","done"]},
    {title:"Results",note:"written when the run is complete",vars:both(s=>["t_touch_"+s,"Fpeak_"+s,"W_end_"+s,"w_rel_"+s,"books_max_"+s])},
    {title:"Stored run",note:"one row per stored sample: every 1 ms to 2.5 s, every 2 ms to 9 s",vars:["ts","nstep"].concat(ball("iron"),ball("cot"))},
    {title:"Shape of the balls",note:"bonds and fibres, made once",vars:["bi_iron","bj_iron","l0_iron","bi_cot","bj_cot","l0_cot","type_cot","fibre_cot"]},
    {title:"Checkpoints",note:"the full state every 125 samples, so Check can rerun the model to any sample in under a second",vars:["ck_n","ck_step"].concat(cks("iron"),cks("cot"))},
    {title:"Playback",note:"the sample on screen now",vars:["t_play","i_now","t_now","slow","playing"].concat(both(s=>["F_now_"+s,"Fmax_now_"+s,"W_now_"+s,"kgpeak_now_"+s,"kgw_now_"+s,"yp_now_"+s,"KE_now_"+s,"books_now_"+s]))},
    {title:"Drawing",note:"how stored values become pixels",vars:["W_px","H_px","HS_px","dpr","ruler_px","top_px","bottom_px","col_w","sc","view_m","cam_y","gain","gauge_R","gauge_cy","gauge_FS"].concat(both(s=>["bx_"+s,"shift_"+s,"plate_px_"+s,"needle_"+s,"peakneedle_"+s]))}
  ],
  rowLabel:{n:j=>"t = "+G("ts")[j].toFixed(3)+" s",c:j=>"n = "+j*CK},
  probe,inspect,locate,check,drawn,
  round:{time:"t_play",label:()=>"one drop, t = 0 to 9 s of the stored run",length:()=>P.tmax,
    columns:both(s=>["F_now_"+s,"yp_now_"+s,"KE_now_"+s]),point:()=>({what:"scale",s:"iron",part:"gauge"}),
    blocked:()=>playing&&tPlay>0.02?"a drop is under way; when it ends, Record starts a new one from t = 0":null},
  about:"Nothing here is computed while you watch. The drop is computed once when the page opens and every sample is stored: every 1 ms up to 2.5 s, every 2 ms after. "+
    "Each frame draws the stored sample nearest to the playback time, without interpolation. Positions and speeds of the 91 atoms and 612 beads are stored as float32 to keep the store near 50 MB, so their checks agree to about seven figures; everything else is float64. "+
    "The plate's travel is drawn G = 10 times larger than computed, and the ball resting on it is shifted with it by (G − 1) y<sub>p</sub>, so you can see the head give; the scale reading uses the true travel. "+
    "The camera follows the lowest iron atom, for both columns. Bond colours (wine squeezed, blue stretched, saturated at 0.7 % strain for iron; cotton fibres darken above 1.2 % squeeze) are worked out at drawing time from the stored positions and are not stored themselves. "+
    "The cotton fibres are drawn as smooth curves through the beads, so a fibre passes near, not exactly through, each bead. The gauges have a square-root dial with full scale 700 N; the weight is the mean reading from 4 s on and appears on the panel from 6.5 s. "+
    "A checkpoint of the full state every 125 samples lets Check rerun the model from the one before any sample; the first checkpoint is itself checked against a fresh build stepped from t = 0."
};

requestAnimationFrame(frame);
</script>
