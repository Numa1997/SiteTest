<title>{{TITLE}}</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="{{FONTS}}" rel="stylesheet">
<link rel="stylesheet" href="{{BASE}}styles/paper.css">
<link rel="stylesheet" href="{{BASE}}styles/data.css">
<style>
:root{--bg:#ece3d2;--panel:#f8f2e6;--paper:#fcf8f0;--ink:#23160f;--muted:#6f5b4c;--line:#3f2c23;--rule:#dccdb4;
--wine:#7d1d2f;--wine-deep:#5a0f21;--wine-soft:#f3dfdb;--blue:#33627f;--blue-soft:#e1ebf0;--green:#3c6a46;--green-soft:#e3ece2;--pic:#f6ecdc}
/* the tokens the data panel (styles/data.css) reads, in this study's colours */
:root{--accent:var(--wine);--accent-dark:var(--wine-deep);--accent-rose:#e2a2aa;--card:var(--paper);--card-soft:var(--panel);--ink-2:#3f2c23;--ink-3:#5c4839;
--rule-soft:#e8dcc6;--tan:#efe4c8;--tan-ink:#7a4b12;--shadow:0 14px 40px rgba(60,40,20,.12);
--sans:"IBM Plex Sans",system-ui,sans-serif;--mono:"IBM Plex Mono",ui-monospace,monospace;--serif:"Instrument Serif",Georgia,serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16.5px/1.68 var(--f-body)}
main{max-width:1000px;margin:0 auto;padding-block:28px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root{color-scheme:light}
.eyebrow{font:500 11.5px/1.4 var(--f-mono);letter-spacing:.14em;text-transform:uppercase;color:var(--wine)}
h1{font:400 clamp(36px,6.4vw,60px)/1.06 var(--f-title);color:var(--wine-deep);margin:8px 0 10px}
/* element rules of the study, kept off the data panel's own elements and given no weight, so classes win as before */
:where(h2:not(.dp *)){font:400 clamp(26px,4vw,34px)/1.15 var(--f-title);color:var(--wine-deep);margin:0 0 10px;display:flex;gap:12px;align-items:center}
h2 .num{font:500 13px var(--f-mono);background:var(--wine);color:#fff;border-radius:999px;padding:3px 10px;flex:none}
:where(h3:not(.dp *)){font:400 22px/1.2 var(--f-title);color:var(--wine-deep);margin:18px 0 6px}
:where(p:not(.dp *):not(.dp-read *)){margin:0 0 12px;max-width:76ch}
.lede{color:var(--muted);max-width:74ch;margin-bottom:20px}
.card{background:var(--panel);border:1.5px solid var(--line);border-radius:12px;padding:16px;margin-bottom:18px}
:where(canvas:not(.dp-overlay):not(.dp canvas)){display:block;width:100%;background:var(--paper);border:1.5px solid var(--line);border-radius:8px}
/* the main figure: the canvas fills #stage exactly, so the panel's overlay and the drawing share one set of css pixels */
.stage{margin:0;background:var(--paper);border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
#stage{position:relative}
#stage>#sim{border:0;border-radius:0}
/* the drop's height before the script sizes it (fitAll: 430 or, from 640 px of stage, 470, plus the 214 px gauge strip), so nothing below jumps */
#stage{container-type:inline-size}
#stage>#sim{height:644px}
@container (min-width:640px){#stage>#sim{height:684px}}
#stage>canvas.dp-overlay{position:absolute;inset:0;width:100%;height:100%;display:block;pointer-events:none;z-index:5}
#stage.dp-reading{cursor:crosshair;touch-action:none;-webkit-user-select:none;user-select:none}
.stage__cap{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:6px 16px;margin:0;max-width:none;padding:8px 12px;border-top:1px solid var(--rule);font-size:14px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:12px 0}
:where(button:not(.dp *):not(.dp-read *):not(.dp-readbtn):not(.dp-tab)){font:500 14px var(--f-body);background:var(--paper);color:var(--wine-deep);border:1.5px solid var(--line);border-radius:8px;padding:6px 14px;cursor:pointer}
button.on{background:var(--wine);color:#fff}
  .hint{border:1.5px solid var(--wine-deep);background:var(--paper);border-radius:8px;padding:8px 12px;margin-bottom:10px;color:var(--wine-deep)}
.hint b{font-weight:500}
button.go{background:var(--wine-deep);color:#fff;font-size:16px;padding:8px 22px}
button:disabled{opacity:.55;cursor:wait}
.small{font-size:14px;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:700px){.two{grid-template-columns:1fr}}
.read{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 12px;font-size:14.5px}
.read b{color:var(--wine-deep);font-weight:500}
.read table{width:100%;border-collapse:collapse}
.read td{padding:2px 0;vertical-align:top}
.read td.v{text-align:end;font-family:var(--f-mono);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
.m{font-family:var(--f-math);font-style:normal;direction:ltr;unicode-bidi:isolate;white-space:nowrap}
.eq{background:var(--paper);border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 12px;font:17px/1.6 var(--f-math);direction:ltr;text-align:center;overflow-x:auto}
.eq.key{border:2px solid var(--wine)}
.box{border:1.5px solid var(--line);border-radius:8px;padding:10px 14px;margin:0 0 12px}
.box .tag{font:500 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;margin-bottom:4px}
.pic{background:var(--pic)} .pic .tag{color:var(--muted)}
.chk{background:var(--green-soft)} .chk .tag{color:var(--green)}
.toy{background:var(--wine-soft)} .toy .tag{color:var(--wine)}
.note{background:var(--blue-soft)} .note .tag{color:var(--blue)}
.box p:last-child{margin-bottom:0}
.tw{overflow-x:auto}
table.par{border-collapse:collapse;width:100%;font-size:14px;background:var(--paper)}
table.par th,table.par td{border:1.5px solid var(--line);padding:6px 8px;text-align:start;vertical-align:top}
table.par th{background:var(--wine-soft);color:var(--wine-deep);font-weight:500}
table.par td.v{font-family:var(--f-mono);white-space:nowrap;direction:ltr;unicode-bidi:isolate}
table.par tr.sec td{background:#efe5d3;color:var(--wine-deep);font-weight:500}
ol.src{padding-inline-start:20px;font-size:14.5px} ol.src li{margin-bottom:4px}
a{color:var(--wine)}
.sitebar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px 16px;font:500 13px var(--f-mono);margin-bottom:18px}
.sitebar a{text-decoration:none}.sitebar .langs a[aria-current]{color:var(--ink);font-weight:600}
.sim-error{border:1.5px solid var(--wine);background:var(--wine-soft);border-radius:8px;padding:8px 12px;margin-bottom:12px}
{{CSSLANG}}
</style>
<main lang="{{LANG}}" dir="{{DIR}}">
{{SITEBAR}}
<div class="eyebrow" data-t="eyebrow"></div>
<h1 data-t="title"></h1>
<p class="lede" data-t="lede"></p>

<div class="card">
  <div class="hint" id="hint"></div>
  <figure class="stage">
    <div id="stage"><canvas id="sim"></canvas></div>
    <figcaption class="stage__cap"><span data-t="headnote"></span></figcaption>
  </figure>
  <div class="bar">
    <button id="drop" class="go" data-t="drop"></button>
    <button id="s1" data-t="speed1"></button>
    <button id="s4" class="on" data-t="speed4"></button>
    <button id="s20" data-t="speed20"></button>
    <button id="air"></button>
    <span class="small" id="clock"></span>
  </div>
  <div class="two">
    <div class="read" id="rI"></div>
    <div class="read" id="rC"></div>
  </div>
</div>

<div class="card">
  <h3 data-t="plot_title"></h3>
  <p class="small" data-t="plot_note"></p>
  <div class="two"><canvas id="pZoom" height="220"></canvas><canvas id="pAll" height="220"></canvas></div>
</div>

<div class="card">
  <h3 data-t="energy_title"></h3>
  <p class="small" data-t="energy_note"></p>
  <canvas id="en" height="250"></canvas>
</div>

<div id="sections"></div>

<div class="card">
  <h2><span class="num">8</span><span data-t="h_par"></span></h2>
  <p data-t="par_intro"></p>
  <div class="tw"><table class="par" id="ptab"></table></div>
</div>

<div class="card">
  <h2><span class="num">9</span><span data-t="h_src"></span></h2>
  <ol class="src" id="src"></ol>
</div>
</main>

<script src="{{BASE}}scripts/sim.js"></script>
<script src="{{BASE}}scripts/dataset.js"></script>
<script>
"use strict";
document.documentElement.lang="{{LANG}}";document.documentElement.dir="{{DIR}}";
{{PHYSICS}}

const T={{TEXT_JSON}};
const RTL={{RTL}};
const FONT={{CANVAS_FONTS}};

// ---------------- page text ----------------
document.querySelectorAll("[data-t]").forEach(e=>e.innerHTML=T[e.dataset.t]);
document.getElementById("sections").innerHTML=T.sections;
(function(){
  let h=`<tr><th>${T.th[0]}</th><th>${T.th[1]}</th><th>${T.th[2]}</th></tr>`;
  for(const r of T.rows){
    if(r.length===1)h+=`<tr class="sec"><td colspan="3">${r[0]}</td></tr>`;
    else h+=`<tr><td>${r[0]}</td><td class="v">${r[1]}</td><td>${r[2]}</td></tr>`;
  }
  document.getElementById("ptab").innerHTML=h;
  document.getElementById("src").innerHTML=T.sources.map(s=>`<li>${s}</li>`).join("");
})();

// ---------------- run the model once, store it, then play it back ----------------
// The drop is computed in small slices after the page opens (the page stays usable) and stored:
// every 1 ms up to 2.5 s (fall and impact), every 2 ms after that (settling).
const T1=2.5,NF1=Math.round(T1/1e-3),NF=NF1+Math.round((P.tmax-T1)/2e-3)+1;
const tOf=k=>k<=NF1?k*1e-3:T1+(k-NF1)*2e-3;
const kOf=t=>t<=T1?Math.round(t/1e-3):Math.min(NF-1,NF1+Math.round((t-T1)/2e-3));
const CK=125,NCK=Math.floor((NF-1)/CK)+1;   // a full-state checkpoint every 125 samples: Check reruns the model from the one before a sample
const W0=4.0,WSHOW=6.5,KW0=kOf(W0);         // the scale's weight: average of its reading from 4 s on, shown from 6.5 s
const BALLS=["iron","cot"];
P.air.on=new URLSearchParams(location.search).get("air")==="1"?1:0;   // the Air button reopens the page with ?air=1 (or without)
let iron,cot,body={},computed=0,steps=0,playing=false,tPlay=0,slow=4,last=null,ds,D={},wsum={iron:0,cot:0},wcnt={iron:0,cot:0},tStart=0;

// ---------------- the store: every number of the run is written into it where it is computed (scripts/dataset.js) ----------------
function declare(){
  ds=Sim.dataset({title:"Iron, cotton and the head",attrs:{study:"portfolios/impact",page:"{{PAGE}}",
    model:"particles under Newton's second law, semi-implicit Euler; Morse bonds (iron), fibres with stretch, bending, junctions and contact (cotton); head = plate on a spring and damper",
    start:"both balls at rest, lowest point 10 m above the plate"}});
  const v=(n,dims,type,a)=>ds.var(n,dims,type,a);
  const par=(n,val,a)=>{v(n,[],Number.isInteger(val)&&!a.float?"int":"float",Object.assign({computed_in:"P (the model's constants)"},a));ds.set(n,val)};
  // parameters: the constants of P, exactly as the model uses them
  par("g",P.g,{symbol:"g",units:"m/s²",long_name:"gravity",digits:2,float:1});
  par("h",P.h,{symbol:"h",units:"m",long_name:"drop height, plate to the lowest point of the ball",digits:1,float:1});
  par("M",P.M,{symbol:"M",units:"kg",long_name:"mass of each ball",digits:3,float:1});
  par("dt",P.dt,{symbol:"Δt",units:"s",long_name:"frame step of the model",digits:5,float:1});
  par("tmax",P.tmax,{symbol:"t<sub>end</sub>",units:"s",long_name:"length of the run",digits:1,float:1});
  par("a_iron",P.iron.a,{symbol:"a",units:"m",long_name:"iron: lattice spacing",digits:3,float:1});
  par("R_iron",P.iron.R,{symbol:"R<sub>Fe</sub>",units:"m",long_name:"iron: radius of the ball",digits:2,float:1});
  par("k_iron",P.iron.k,{symbol:"k",units:"N/m",long_name:"iron: Morse bond stiffness at rest, 2Dα²",digits:0,float:1});
  par("ar0",P.iron.ar0,{symbol:"αr<sub>0</sub>",long_name:"iron: Morse shape (Girifalco and Weizer)",digits:2,float:1});
  par("c_iron",P.iron.c,{symbol:"c<sub>Fe</sub>",units:"N·s/m",long_name:"iron: bond damper",digits:2,float:1});
  par("rad_iron",P.iron.rad,{symbol:"r<sub>Fe</sub>",units:"m",long_name:"iron: contact radius of an atom on the plate",digits:3,float:1});
  par("sub_iron",P.iron.sub,{symbol:"n<sub>Fe</sub>",long_name:"iron: sub-steps per frame step",digits:0});
  par("R_cot",P.cot.R,{symbol:"R<sub>c</sub>",units:"m",long_name:"cotton: radius of the circle the fibres curl in",digits:2,float:1});
  par("nf",P.cot.nf,{symbol:"n<sub>f</sub>",long_name:"cotton: fibres",digits:0});
  par("nb",P.cot.nb,{symbol:"n<sub>b</sub>",long_name:"cotton: beads per fibre",digits:0});
  par("s_cot",P.cot.s,{symbol:"s",units:"m",long_name:"cotton: bead spacing",digits:3,float:1});
  par("turn",P.cot.turn,{symbol:"σ<sub>turn</sub>",units:"rad",long_name:"cotton: random turn per bead while the fibre is laid",digits:2,float:1});
  par("kax",P.cot.kax,{symbol:"k<sub>ax</sub>",units:"N/m",long_name:"cotton: stretch spring along a fibre",digits:0,float:1});
  par("kb",P.cot.kb,{symbol:"κ",units:"N·m/rad",long_name:"cotton: bending spring",digits:3,float:1});
  par("cb",P.cot.cb,{symbol:"c<sub>b</sub>",units:"N·m·s/rad",long_name:"cotton: bending friction",digits:4,float:1});
  par("c_cot",P.cot.c,{symbol:"c",units:"N·s/m",long_name:"cotton: stretch damper (junctions take 0.2 of it)",digits:2,float:1});
  par("jr",P.cot.jr,{symbol:"r<sub>j</sub>",units:"m",long_name:"cotton: beads closer than this at the start are joined",digits:3,float:1});
  par("kj",P.cot.kj,{symbol:"k<sub>j</sub>",units:"N/m",long_name:"cotton: junction stiffness",digits:0,float:1});
  par("Fj",P.cot.Fj,{symbol:"F<sub>j</sub>",units:"N",long_name:"cotton: largest pull of a junction",digits:1,float:1});
  par("drep",P.cot.drep,{symbol:"d<sub>c</sub>",units:"m",long_name:"cotton: contact range between fibres",digits:3,float:1});
  par("krep",P.cot.krep,{symbol:"k<sub>c</sub>",units:"N/m",long_name:"cotton: contact push-back",digits:0,float:1});
  par("crep",P.cot.crep,{symbol:"c<sub>c</sub>",units:"N·s/m",long_name:"cotton: contact rubbing friction",digits:2,float:1});
  par("rad_cot",P.cot.rad,{symbol:"r<sub>c</sub>",units:"m",long_name:"cotton: contact radius of a bead on the plate",digits:3,float:1});
  par("seed",P.cot.seed,{symbol:"seed",long_name:"cotton: seed of the random tangle",digits:0});
  par("sub_cot",P.cot.sub,{symbol:"n<sub>c</sub>",long_name:"cotton: sub-steps per frame step",digits:0});
  par("mp",P.head.mp,{symbol:"m<sub>p</sub>",units:"kg",long_name:"head: plate mass",digits:2,float:1});
  par("kh",P.head.kh,{symbol:"k<sub>h</sub>",units:"N/m",long_name:"head: spring, which is also the scale",digits:0,float:1});
  par("ch",P.head.ch,{symbol:"c<sub>h</sub>",units:"N·s/m",long_name:"head: damper (soft tissue)",digits:1,float:1});
  par("wc",P.head.wc,{symbol:"ω<sub>c</sub>",units:"rad/s",long_name:"skin contact: angular frequency of a particle on the plate",digits:0,float:1});
  par("zc",P.head.zc,{symbol:"ζ<sub>c</sub>",long_name:"skin contact: damping ratio",digits:2,float:1});
  par("air_on",P.air.on,{symbol:"air",long_name:"air drag: 1 on (the page opened with ?air=1), 0 off",digits:0});
  par("rho_air",P.air.rho,{symbol:"ρ<sub>air</sub>",units:"kg/m³",long_name:"air: density",digits:2,float:1});
  par("Cd",P.air.Cd,{symbol:"C<sub>d</sub>",long_name:"air: drag coefficient of a sphere",digits:2,float:1});
  par("dens_iron",P.air.dens.iron,{symbol:"ρ<sub>Fe</sub>",units:"kg/m³",long_name:"air: density of real iron, for the size of a real 1 kg ball",digits:0,float:1});
  par("dens_cot",P.air.dens.cot,{symbol:"ρ<sub>c</sub>",units:"kg/m³",long_name:"air: density of loose cotton wool, for the size of a real 1 kg ball",digits:0,float:1});
  // derived: computed once, when the two balls are built
  for(const s of BALLS){const b=body[s],F=s==="iron"?"Fe":"c",nm=s==="iron"?"iron":"cotton";
    v("N_"+s,[],"int",{symbol:"N<sub>"+F+"</sub>",long_name:nm+": particles",computed_in:s==="iron"?"makeIron()":"makeCotton()",digits:0});ds.set("N_"+s,b.N);
    v("nbond_"+s,[],"int",{symbol:"n<sub>bonds</sub>",long_name:nm+": bonds"+(s==="cot"?" (stretch springs and junctions)":""),computed_in:s==="iron"?"makeIron()":"makeCotton()",digits:0});ds.set("nbond_"+s,b.nb);
    v("m_"+s,[],"float",{symbol:"m<sub>"+F+"</sub>",units:"kg",long_name:nm+": mass of one particle",computed_in:"newBody()",formula:"M / N",digits:6});ds.set("m_"+s,b.m);
    v("kc_"+s,[],"float",{symbol:"k<sub>skin</sub>",units:"N/m",long_name:nm+": stiffness of a particle's contact with the plate",computed_in:"newBody()",formula:"m ω<sub>c</sub>²",digits:2});ds.set("kc_"+s,b.kc);
    v("cc_"+s,[],"float",{symbol:"c<sub>skin</sub>",units:"N·s/m",long_name:nm+": damping of that contact",computed_in:"newBody()",formula:"2 ζ<sub>c</sub> m ω<sub>c</sub>",digits:4});ds.set("cc_"+s,b.cc);
    v("y00_"+s,[],"float",{symbol:"y<sub>00</sub>",units:"m",long_name:nm+": zero of the height energy (mean height at the start minus h)",computed_in:s==="iron"?"newBody()":"relax()",formula:"mean y<sub>i</sub>(0) − h",digits:6});ds.set("y00_"+s,b.y00);
  }
  v("alpha_iron",[],"float",{symbol:"α",units:"1/m",long_name:"iron: Morse width parameter",computed_in:"makeIron()",formula:"αr<sub>0</sub> / a",digits:3});ds.set("alpha_iron",iron.alm);
  v("D_iron",[],"float",{symbol:"D",units:"J",long_name:"iron: Morse depth, the energy to pull two atoms apart",computed_in:"makeIron()",formula:"k / (2α²)",digits:4});ds.set("D_iron",iron.Dm);
  v("nj_cot",[],"int",{symbol:"n<sub>j</sub>",long_name:"cotton: junctions where fibres cross",computed_in:"makeCotton()",digits:0});ds.set("nj_cot",cot.nj);
  v("ntri_cot",[],"int",{symbol:"n<sub>bend</sub>",long_name:"cotton: bending joints",computed_in:"makeCotton()",digits:0});ds.set("ntri_cot",cot.ntri);
  v("aj_cot",[],"float",{symbol:"α<sub>j</sub>",units:"1/m",long_name:"cotton: junction Morse width parameter",computed_in:"makeCotton()",formula:"k<sub>j</sub> / (4F<sub>j</sub>)",digits:3});ds.set("aj_cot",P.cot.kj/(4*P.cot.Fj));
  v("Dj_cot",[],"float",{symbol:"D<sub>j</sub>",units:"J",long_name:"cotton: junction Morse depth",computed_in:"makeCotton()",formula:"2F<sub>j</sub> / α<sub>j</sub>",digits:4});ds.set("Dj_cot",2*P.cot.Fj/ds.get("aj_cot"));
  for(const s of BALLS){const b=body[s],nm=s==="iron"?"iron":"cotton",vt=Math.sqrt(2*P.M*P.g/(P.air.rho*P.air.Cd*b.Aair));
    v("A_"+s,[],"float",{symbol:"A",units:"m²",long_name:nm+": cross-section of a real 1 kg ball of this material, met by the air",computed_in:"newBody()",formula:"π (3M / 4πρ)<sup>2/3</sup>",digits:6});ds.set("A_"+s,b.Aair);
    v("vt_"+s,[],"float",{symbol:"v<sub>t</sub>",units:"m/s",long_name:nm+": terminal speed in air, where drag equals weight",computed_in:"declare()",formula:"√(2Mg / (ρ<sub>air</sub> C<sub>d</sub> A))",digits:3});ds.set("vt_"+s,vt);
    v("t_air_"+s,[],"float",{symbol:"t*<sub>air</sub>",units:"s",long_name:nm+": first touch predicted with air drag (closed form)",computed_in:"declare()",formula:"(v<sub>t</sub>/g) arcosh(e<sup>gh/v<sub>t</sub>²</sup>)",digits:4});ds.set("t_air_"+s,vt/P.g*Math.acosh(Math.exp(P.g*P.h/vt/vt)));
    v("v_air_"+s,[],"float",{symbol:"v*<sub>air</sub>",units:"m/s",long_name:nm+": speed at that touch, with air drag (closed form)",computed_in:"declare()",formula:"v<sub>t</sub> √(1 − e<sup>−2gh/v<sub>t</sub>²</sup>)",digits:4});ds.set("v_air_"+s,vt*Math.sqrt(1-Math.exp(-2*P.g*P.h/vt/vt)));
  }
  v("t_star",[],"float",{symbol:"t*",units:"s",long_name:"first touch predicted by Newton for a free fall",computed_in:"declare()",formula:"√(2h/g)",digits:4});ds.set("t_star",Math.sqrt(2*P.h/P.g));
  v("v_star",[],"float",{symbol:"v*",units:"m/s",long_name:"speed at that touch",computed_in:"declare()",formula:"√(2gh)",digits:4});ds.set("v_star",Math.sqrt(2*P.g*P.h));
  v("Mg",[],"float",{symbol:"Mg",units:"N",long_name:"weight of either ball",computed_in:"declare()",formula:"M g",digits:4});ds.set("Mg",P.M*P.g);
  for(const s of BALLS)v("E0_"+s,[],"float",{symbol:"E<sub>0</sub>",units:"J",long_name:(s==="iron"?"iron":"cotton")+": energy at the first stored sample, the start of the books",computed_in:"init()",formula:"K + V + E<sub>el</sub> + E<sub>head</sub> + Q<sub>ball</sub> + Q<sub>head</sub> + Q<sub>air</sub> at n = 0",digits:6});
  // solver

function record(k){
  for(const s of BALLS){
    const b=body[s],d=D[s],N=b.N,o=k*N,e=b.E;
    for(let i=0;i<N;i++){d.x[o+i]=b.x[i];d.y[o+i]=b.y[i];d.sp[o+i]=Math.sqrt(b.u[i]*b.u[i]+b.v[i]*b.v[i])}
    d.yp[k]=b.yp;d.vp[k]=b.vp;d.F[k]=b.Fs;d.Fmax[k]=b.Fmax;
    d.KE[k]=e.KE;d.PE[k]=e.PE;d.El[k]=e.elastic;d.Eh[k]=e.head;d.Qb[k]=e.heatBall;d.Qh[k]=e.heatHead;d.Qa[k]=e.heatAir;
    d.Ein[k]=b.E0-d.PE[k];d.Esum[k]=d.KE[k]+d.El[k]+d.Eh[k]+d.Qb[k]+d.Qh[k]+d.Qa[k];d.books[k]=d.Esum[k]-d.Ein[k];
    if(k>=KW0){wsum[s]+=d.F[k];wcnt[s]++;d.W[k]=wsum[s]/wcnt[s]}else d.W[k]=NaN;
    if(b.tImpact!==null&&!(ds.get("t_touch_"+s)>=0))ds.set("t_touch_"+s,b.tImpact);
    if(k%CK===0){const c=k/CK,ck=n=>ds.get("ck_"+n+"_"+s);
      ck("x").set(b.x,c*N);ck("y").set(b.y,c*N);ck("u").set(b.u,c*N);ck("v").set(b.v,c*N);ck("alive").set(b.alive,c*b.nb);
      ck("t")[c]=b.t;ck("yp")[c]=b.yp;ck("vp")[c]=b.vp;ck("Fmax")[c]=b.Fmax;ck("Qb")[c]=b.heatBall;ck("Qh")[c]=b.heatHead;ck("Qa")[c]=b.heatAir;ck("ti")[c]=b.tImpact===null?NaN:b.tImpact}
  }
  ds.get("nstep")[k]=steps;
  if(k%CK===0){ds.get("ck_n")[k/CK]=k;ds.get("ck_step")[k/CK]=steps}
}
const RUN=["nstep","ck_n","ck_step"];for(const s of BALLS)for(const q of ["x","y","sp","yp","vp","F","Fmax","KE","PE","El","Eh","Qb","Qh","Qa","Ein","Esum","books","W","ck_x","ck_y","ck_u","ck_v","ck_t","ck_yp","ck_vp","ck_Fmax","ck_Qb","ck_Qh","ck_Qa","ck_ti","ck_alive"])RUN.push(q+"_"+s);
function init(){
  iron=makeIron();cot=makeCotton();body={iron:iron,cot:cot};
  declare();
  for(const s of BALLS){const b=body[s];b.Fs=step(b);const e=b.E;b.E0=e.KE+e.PE+e.elastic+e.head+e.heatBall+e.heatHead+e.heatAir;ds.set("E0_"+s,b.E0)}
  steps=1;record(0);computed=1;ds.set("computed",1);ds.set("steps",steps);ds.set("done",false);
  tStart=performance.now();setTimeout(work,0);
}
function work(){
  const t0=performance.now();
  while(computed<NF&&performance.now()-t0<14){
    const target=tOf(computed);
    while(iron.t<target-1e-9){iron.Fs=step(iron);cot.Fs=step(cot);steps++}
    record(computed);computed++;
  }
  ds.set("computed",computed);ds.set("steps",steps);for(const n of RUN)ds.touch(n);
  if(computed<NF){setTimeout(work,0);return}
  ds.set("compute_ms",performance.now()-tStart);
  for(const s of BALLS){const d=D[s];let m=0;for(let k=0;k<NF;k++)m=Math.max(m,Math.abs(d.books[k]));
    ds.set("Fpeak_"+s,d.Fmax[NF-1]);ds.set("W_end_"+s,d.W[NF-1]);ds.set("w_rel_"+s,(d.W[NF-1]-ds.get("Mg"))/ds.get("Mg"));ds.set("books_max_"+s,m)}
  ds.set("done",true);
}
function setNow(k){       // the clock: the sample on screen, copied from the stored arrays
  ds.set("t_play",tPlay);ds.set("i_now",k);ds.set("t_now",ds.get("ts")[k]);ds.set("playing",playing);
  for(const s of BALLS){const d=D[s];
    ds.set("F_now_"+s,d.F[k]);ds.set("Fmax_now_"+s,d.Fmax[k]);ds.set("yp_now_"+s,d.yp[k]);ds.set("KE_now_"+s,d.KE[k]);ds.set("books_now_"+s,d.books[k]);
    ds.set("W_now_"+s,ds.get("t_now")>=WSHOW?d.W[k]:NaN);ds.set("kgpeak_now_"+s,ds.get("Fmax_now_"+s)/P.g);ds.set("kgw_now_"+s,ds.get("W_now_"+s)/P.g)}
}

function fitAll(){

  W=cv.getBoundingClientRect().width;HS=W<640?430:470;H=HS+GAUGE_H;
  cv.style.height=H+"px";cv.width=W*d;cv.height=H*d;cx.setTransform(d,0,0,d,0,0);
  for(const id of ["pZoom","pAll","en"]){const c=document.getElementById(id),r=c.getBoundingClientRect(),h=+(c.dataset.h||(c.dataset.h=c.getAttribute("height")));/* the design height, read once: the attribute is overwritten below with height × dpr, and reading it again grew the plot dpr-fold on every resize (a phone fires one whenever its address bar slides) */c.style.height=h+"px";c.width=r.width*d;c.height=h*d;c.getContext("2d").setTransform(d,0,0,d,0,0)}
  if(ds){ds.set("W_px",W);ds.set("H_px",H);ds.set("HS_px",HS);ds.set("dpr",d)}
}
function txt(c,s,x,y,font,color,align,ltr){c.font=font;c.fillStyle=color;c.textAlign=align||"center";c.direction=(RTL&&!ltr)?"rtl":"ltr";c.fillText(s,x,y)}
function spaced(c,s,x,y,font,color,sp){            // letter-spaced capitals for instrument labels (Latin only)
  c.font=font;c.fillStyle=color;c.direction="ltr";c.textAlign="left";
  if(RTL){c.textAlign="center";c.direction="rtl";c.fillText(s,x,y);return}
  let w=0;for(const ch of s)w+=c.measureText(ch).width+sp;w-=sp;let xx=x-w/2;
