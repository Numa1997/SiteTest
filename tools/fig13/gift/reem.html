<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>For رِيمْ</title>
<!-- Film renderer (phone first, 1080 x 1920), a gift: "For رِيمْ" and "فَرَاشَتُكِ" (your butterfly), each written by a chain of 640
     turning arrows: the Fourier series of the word's outline (reem.json from reem_data.py). رِيمْ is traced from the reference plate
     Numa chose (ref_trace.py); فَرَاشَتُكِ is in Amiri (SIL OFL). Gold on navy (dark) or ink on paper (light). Live, it then opens the
     construction film (construction.html), where the butterfly is built by hand from the two plots of the pendulum's motion.
     Serve the repository root; tools/fig13/gift/render.cjs THEME OUT 1 all reem x 1080x1920 writes the frames. -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../../public/fonts/instrument-serif/instrument-serif-400-latin.woff2) format('woff2'); font-style: normal; }
@font-face { font-family: 'Instrument Serif'; src: url(../../../public/fonts/instrument-serif/instrument-serif-400i-latin.woff2) format('woff2'); font-style: italic; }
@font-face { font-family: 'IBM Plex Sans'; src: url(../../../public/fonts/ibm-plex-sans/ibm-plex-sans-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; src: url(../../../public/fonts/ibm-plex-mono/ibm-plex-mono-400-latin.woff2) format('woff2'); }
:root { --bg:#0c1424; --ink:#f3ead6; --ink2:#d8c9a6; --accent:#e3bd6e; }
:root[data-theme="light"] { --bg:#efe8d8; --ink:#1c1518; --ink2:#4a3f33; --accent:#8a6a2e; }
html, body { margin:0; background:var(--bg); height:100%; overflow:hidden; }   /* the stage never widens the page, so a phone does not zoom out */
#stage { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; overflow:hidden; transform-origin:0 0; }
canvas { position:absolute; left:0; top:0; }
.capt { position:absolute; left:96px; top:1560px; width:888px; font-size:30px; line-height:1.45; color:var(--ink); text-align:center; }
.capt b { font-weight:400; color:var(--accent); }
.capt .m { font-family:'IBM Plex Mono',monospace; font-size:21px; color:var(--ink2); }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <div class="capt" id="capA"></div>
  <div class="capt" id="capB"></div>
</div>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.theme = THEME;
const $ = id => document.getElementById(id);
const lerp = (a, b, f) => a + (b - a) * f, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const TH = THEME === 'dark' ? {
    bg: '#0c1424', ink: '#f3ead6', gold: '#e3bd6e', rule: '#b8924a', add: 'lighter', glowFill: 'rgba(227,189,110,0.10)',
    ink3: [246, 226, 178], fill: '#e3bd6e', arrow: 'rgba(240,226,190,0.5)', circle: 'rgba(227,189,110,0.14)', head: '#fff3d6', glow: 0.2
} : {
    bg: '#efe8d8', ink: '#1c1518', gold: '#8a6a2e', rule: '#9b7b3d', add: 'source-over', glowFill: null,
    ink3: [60, 40, 30], fill: '#1c1518', arrow: 'rgba(28,21,24,0.42)', circle: 'rgba(155,123,61,0.18)', head: '#7a1f2b', glow: 0.08
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ------------------------------------------------------------------------------------------------ the words: z(s) = sum_k c_k exp(2 pi i k s)
let WD;
function prepWord(w) {
    const n = w.n; w.X = new Float64Array(n + 1); w.Y = new Float64Array(n + 1); w.hid = new Uint8Array(n + 1);
    for (let j = 0; j <= n; j++) {
        const s = j / n; let x = 0, y = 0;
        for (const [k, a, b] of w.terms) { const ph = 2 * Math.PI * k * s, c = Math.cos(ph), si = Math.sin(ph); x += a * c - b * si; y += a * si + b * c; }
        w.X[j] = x; w.Y[j] = y;
        w.hid[j] = w.hidden.some(([a, b]) => s >= a && s < b) ? 1 : 0;
    }
}
// draw word w with its arrows at parameter s (0..1 drawn), centred at (cx, cy), u px per unit; ink: 0..1 fill
function drawWord(g, w, s, cx, cy, u, arrowsA, ink) {
    const n = w.n, m = Math.floor(clamp(s, 0, 1) * n);
    if (ink > 0.001) {   // the ink: the outline filled (its own fill rule), fading in once written
        g.globalAlpha = ink; g.fillStyle = TH.fill; g.beginPath();
        for (const c of w.fill) { c.forEach(([x, y], i) => i ? g.lineTo(cx + u * x, cy - u * y) : g.moveTo(cx + u * x, cy - u * y)); g.closePath(); }
        g.fill(w.rule || 'nonzero'); g.globalAlpha = 1;
    }
    const trailA = 1 - 0.75 * ink;
    if (m > 1 && trailA > 0.02) {   // the line the tip has written, pen-up bridges left out
        g.globalCompositeOperation = TH.add; g.lineJoin = 'round'; g.lineCap = 'round';
        for (const [lw, a] of [[Math.max(2, u * 0.03), TH.glow], [Math.max(1.2, u * 0.008), 0.95]]) {
            g.strokeStyle = rgba(TH.ink3, a * trailA); g.lineWidth = lw; g.beginPath(); let down = false;
            for (let j = 0; j <= m; j++) { const x = cx + u * w.X[j], y = cy - u * w.Y[j]; if (w.hid[j]) { down = false; continue; } down ? g.lineTo(x, y) : g.moveTo(x, y); down = true; }
            g.stroke();
        }
        g.globalCompositeOperation = 'source-over';
    }
    if (arrowsA > 0.01) {   // the chain of arrows at s: largest first, each turning k whole turns while s goes 0 -> 1
        let x = cx, y = cy; const sp = clamp(s, 0, 1);
        g.lineCap = 'round';
        w.terms.forEach(([k, a, b], i) => {
            const ph = 2 * Math.PI * k * sp, c = Math.cos(ph), si = Math.sin(ph), dx = u * (a * c - b * si), dy = -u * (a * si + b * c), r = Math.hypot(dx, dy);
            if (k !== 0 && i < 48 && r > 3) { g.globalAlpha = arrowsA; g.strokeStyle = TH.circle; g.lineWidth = 1; g.beginPath(); g.arc(x, y, r, 0, 7); g.stroke(); }
            if (k !== 0 && r > 0.6) { g.globalAlpha = arrowsA * (i < 80 ? 1 : 0.5); g.strokeStyle = TH.arrow; g.lineWidth = i < 12 ? 2 : 1.2; g.beginPath(); g.moveTo(x, y); g.lineTo(x + dx, y + dy); g.stroke(); }
            x += dx; y += dy;
        });
        g.globalAlpha = arrowsA; g.fillStyle = TH.head; g.beginPath(); g.arc(x, y, 6, 0, 7); g.fill();
        g.globalAlpha = arrowsA * 0.25; g.beginPath(); g.arc(x, y, 15, 0, 7); g.fill(); g.globalAlpha = 1;
    }
}

// ------------------------------------------------------------------------------------------------ timeline (frames at 30 per second)
const FPS = 30;
const TL = { in: 0, w1: 40, w1e: 400, f1: 450, w2: 470, w2e: 830, f2: 880, out0: 1000, total: 1040 };
// the plate: a gold double rule round the page, "For" in italic, the name, then "your butterfly"
const P1 = { cx: 540, cy: 700, u: 360 }, P2 = { cx: 540, cy: 1250, u: 400 };
function drawScene(g, f) {
    g.fillStyle = TH.bg; g.fillRect(0, 0, 1080, 1920);
    const a = ease(f / 30) * (1 - ease((f - TL.out0) / (TL.total - TL.out0)));
    g.globalAlpha = a; g.strokeStyle = TH.rule;
    g.lineWidth = 3; g.strokeRect(40, 40, 1000, 1840); g.lineWidth = 1.2; g.strokeRect(62, 62, 956, 1796);
    g.fillStyle = TH.gold; g.font = 'italic 112px "Instrument Serif"'; g.textAlign = 'center'; g.fillText('For', 540, 330);
    g.globalAlpha = 1;
    g.save(); g.globalAlpha = a;
    const s1 = (f - TL.w1) / (TL.w1e - TL.w1), ink1 = ease((f - TL.w1e) / (TL.f1 - TL.w1e)), arr1 = (1 - ease((f - TL.w1e) / 30)) * ease((f - TL.w1 + 10) / 15);
    if (TH.glowFill && ink1 > 0) glowWord(g, WD.reem, P1, ink1);
    drawWord(g, WD.reem, s1, P1.cx, P1.cy, P1.u, arr1, ink1);
    if (f >= TL.w2 - 15) {
        const s2 = (f - TL.w2) / (TL.w2e - TL.w2), ink2 = ease((f - TL.w2e) / (TL.f2 - TL.w2e)), arr2 = (1 - ease((f - TL.w2e) / 30)) * ease((f - TL.w2 + 15) / 15);
        if (TH.glowFill && ink2 > 0) glowWord(g, WD.butterfly, P2, ink2);
        drawWord(g, WD.butterfly, s2, P2.cx, P2.cy, P2.u, arr2, ink2);
    }
    g.restore();
}
function glowWord(g, w, P, a) {   // a soft halo of gold round the inked word (dark plate only)
    g.save(); g.globalAlpha = a; g.shadowColor = 'rgba(227,189,110,0.55)'; g.shadowBlur = 26; g.fillStyle = TH.fill; g.beginPath();
    for (const c of w.fill) { c.forEach(([x, y], i) => i ? g.lineTo(P.cx + P.u * x, P.cy - P.u * y) : g.moveTo(P.cx + P.u * x, P.cy - P.u * y)); g.closePath(); }
    g.fill(w.rule || 'nonzero'); g.restore();
}

// ------------------------------------------------------------------------------------------------ words under the plate
let CAPS;
function captions() {
    CAPS = [
        [0, '<b>رِيمْ</b>, written by 640 turning arrows. Each turns a whole number of times while the name is written once; added head to tail, their tip writes it.<br><span class="m">z(s) = Σₖ cₖ · exp(2πi k s)</span>'],
        [TL.w2 - 20, '<b>فَرَاشَتُكِ</b>: your butterfly. The same 640 arrows, other lengths, other starting angles.'],
        [TL.f2 + 10, 'Your butterfly itself needs only two arrows: the two rods of a double pendulum. Here is how to build it by hand.'],
    ];
}
const memo = {};
function setHTML(el, key, html) { if (memo[key] !== html) { memo[key] = html; el.innerHTML = html; } }
function showCaption(f) {
    let k = 0; while (k + 1 < CAPS.length && f >= CAPS[k + 1][0]) k++;
    const u = (k === 0 ? ease(f / 30) : ease((f - CAPS[k][0]) / 14)) * (1 - ease((f - TL.out0) / (TL.total - TL.out0))), prev = k > 0 ? CAPS[k - 1][1] : '';
    const [cur, old] = (k % 2 === 0) ? [$('capA'), $('capB')] : [$('capB'), $('capA')];
    setHTML(cur, 'c' + cur.id, CAPS[k][1]); setHTML(old, 'c' + old.id, prev); cur.style.opacity = u; old.style.opacity = k > 0 ? Math.max(0, 1 - ease((f - CAPS[k][0]) / 14)) : 0;
}

let g, DPR = 1;
function renderFrame(f) { g.setTransform(DPR, 0, 0, DPR, 0, 0); drawScene(g, f); showCaption(f); }
window.renderFrame = renderFrame;
async function boot() {
    DPR = window.devicePixelRatio || 1;
    WD = await (await fetch('reem.json')).json();
    prepWord(WD.reem); prepWord(WD.butterfly); captions();
    const c = $('cv'); c.width = 1080 * DPR; c.height = 1920 * DPR; c.style.width = '1080px'; c.style.height = '1920px'; g = c.getContext('2d');
    await document.fonts.ready;
    await Promise.all(['IBM Plex Mono', 'IBM Plex Sans', 'Instrument Serif'].map(fn => document.fonts.load(`20px "${fn}"`)));
    await document.fonts.load('italic 40px "Instrument Serif"');
    window.FILM = { frames: () => TL.total };
    renderFrame(Number(Q.get('f') || 0)); window.__ready = true;
    // live: play once, then open the construction of the butterfly (same look)
    if (!Q.get('film')) { let f = 0, last = null; const loop = ts => { if (last === null || ts - last >= 1000 / FPS - 2) { renderFrame(Math.min(f, TL.total - 1)); f++; last = ts; } if (f < TL.total) requestAnimationFrame(loop); else location.replace('construction.html?theme=' + THEME); }; requestAnimationFrame(loop); }
}
function fit() {   // scale the stage to the screen (the layout viewport, not innerWidth, which a phone may enlarge) and centre it
    const cw = document.documentElement.clientWidth, ch = document.documentElement.clientHeight, s = Math.min(cw / 1080, ch / 1920, 1);
    $('stage').style.transform = `translate(${Math.max(0, (cw - 1080 * s) / 2)}px, 0) scale(${s})`;
}
if (!Q.get('film')) { fit(); addEventListener('resize', fit); }
boot();
</script>
</body>
</html>
