<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catching the butterfly</title>
<!-- Film renderer (phone first, 1080 x 1920): a double pendulum swinging in chaos is caught by a motor at its top pin and held on
     the butterfly. The motion is computed live as the film plays (pendulum.js: the pendulum's equations and the controller of
     tools/fig13/butterfly_control.py, its gains designed in the browser at start): 8 s free from
     the strike p = (2, 4) kg m^2/s (18 J), then pump and steer, wait, catch with the periodic LQR along the orbit, hold.
     Serve the repository root; tools/fig13/gift/render.cjs THEME OUT 1 all catch x 1080x1920 writes the frames. -->
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../../public/fonts/instrument-serif/instrument-serif-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'Instrument Sans'; src: url(fonts/instrument-sans-400.woff2) format('woff2'); font-weight: 400; }
@font-face { font-family: 'Instrument Sans'; src: url(fonts/instrument-sans-500.woff2) format('woff2'); font-weight: 500; }
@font-face { font-family: 'Instrument Sans'; src: url(../../../public/fonts/ibm-plex-sans/ibm-plex-sans-400-greek.woff2) format('woff2'); unicode-range: U+0370-03FF; }
:root { --bg:#140d10; --ink:#f5f1ea; --muted:#b9a59b; --accent:#e2a2aa; }
:root[data-theme="light"] { --bg:#f5f1ea; --ink:#1c1518; --muted:#6f635d; --accent:#7a1f2b; }
html, body { margin:0; background:var(--bg); height:100%; overflow:hidden; }
#stage { position:absolute; left:0; top:0; width:1080px; height:1920px; background:var(--bg); color:var(--ink); font-family:'Instrument Sans',sans-serif; overflow:hidden; transform-origin:0 0; }
canvas { position:absolute; left:0; top:0; }
#h1 { position:absolute; left:40px; top:40px; font-family:'Instrument Serif',serif; font-size:64px; line-height:1; margin:0; font-weight:400; }
#h2 { overflow:hidden;  position:absolute; left:42px; top:116px; width:560px; font-size:22px; line-height:1.45; color:var(--muted); }
.capt { overflow:hidden;  position:absolute; left:40px; top:1690px; width:1000px; font-size:30px; line-height:1.42; color:var(--ink); }
.capt b { font-weight:400; color:var(--accent); }
.ctl { position:absolute; right:40px; width:400px; height:66px; font:500 28px 'Instrument Sans',sans-serif; color:var(--ink); background:transparent;
       border:2px solid var(--accent); border-radius:14px; cursor:pointer; z-index:3; }
#bRand { top:30px; } #bPick { top:108px; }
#pick { position:absolute; left:40px; top:190px; width:1000px; height:1000px; display:none; z-index:4; cursor:crosshair; touch-action:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="cv"></canvas>
  <h1 id="h1">Catching the butterfly</h1>
  <div id="h2">a motor catches a chaotic double pendulum, sets it on the butterfly, and lets go. Start it anywhere.</div>
  <div class="capt" id="capA"></div>
  <div class="capt" id="capB"></div>
  <button type="button" class="ctl" id="bRand">Random chaos</button>
  <button type="button" class="ctl" id="bPick">Choose a strike</button>
  <canvas id="pick" width="1000" height="1000"></canvas>
</div>
<script src="pendulum.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') === 'light' ? 'light' : 'dark';
document.documentElement.dataset.theme = THEME;
const $ = id => document.getElementById(id);
const lerp = (a, b, f) => a + (b - a) * f, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const TH = THEME === 'dark' ? {
    bg: '#140d10', paper: '#1a1114', rule: '#3a2a2e', ink: '#f5f1ea', muted: '#b9a59b', accent: '#e2a2aa', curve: [226, 162, 170], ghost: [226, 162, 170],
    rods: '#f5f1ea', bob: '#7a1f2b', ring: '#f5f1ea', motor: [240, 190, 120], energy: [150, 200, 235], add: 'lighter', body: '#2a1d21', steel: '#8a7d78', copper: [196, 120, 70], north: [226, 120, 130], south: [130, 170, 220], nib: '#d9c8a8'
} : {
    bg: '#f5f1ea', paper: '#fffaf3', rule: '#d9d0c2', ink: '#1c1518', muted: '#6f635d', accent: '#7a1f2b', curve: [122, 31, 43], ghost: [122, 31, 43],
    rods: '#1c1518', bob: '#7a1f2b', ring: '#fffaf3', motor: [176, 98, 18], energy: [28, 92, 140], add: 'source-over', body: '#e9e1d6', steel: '#8a7d78', copper: [170, 96, 50], north: [190, 70, 80], south: [60, 110, 170], nib: '#3a322e'
};
const rgba = (c, a) => `rgba(${c[0]},${c[1]},${c[2]},${a})`;

// ------------------------------------------------------------------------------------------------ the motion, computed live
// pendulum.js integrates the pendulum and runs the motor's controller as the film plays: struck with p = (2, 4) kg m^2/s (18 J),
// free for 8 s, then pump and steer, wait, catch, hold four laps, let go, four laps free. Nothing is recorded in advance.
let START = [0, 0, 2, 4], START_NAME = 'struck from hanging still with p = (2, 4) kg·m²/s';
const T_FREE = 8, HOLD_LAPS = 4, FREE_LAPS = 4, LOG_EVERY = 4;
let RESTARTS = 0, OWN_F = 0;
let DES, RUN, D, N = 0;
function stateAt(t) {     // linear interpolation of the run so far (samples every D.h seconds)
    const L0 = RUN.log, u = clamp(t / D.h, 0, N - 1.000001), i = Math.floor(u), f = u - i, L = k => lerp(L0[k][i], L0[k][Math.min(i + 1, N - 1)], f);
    return { th1: L('th1'), th2: L('th2'), tau: L('tau'), E: L('E'), dist: L('dist'), mode: L0.mode[i] };
}
const tip = (a, b) => [Math.sin(a) + Math.sin(b), -(Math.cos(a) + Math.cos(b))];

// the film's clock follows the pendulum: chaos at half speed, the motor at work at a quarter, from a second after the catch at half
const FPS = 30;
let FT = [0], TL = { on: null, catch: null, release: null, total: null };
const endT = () => RUN.ev.release !== null ? RUN.ev.release + FREE_LAPS * D.T : Infinity;
function speedOf(t) {      // the film's clock: chaos at half speed; the motor's first try at a quarter, its waiting at full speed; a search after
    if (t < T_FREE) return 0.5;                                  // a miss fast-forwarded four times; from a second after the catch, half speed
    if (RUN.ev.catch !== null && t > RUN.ev.catch + 1) return 0.5;
    if (RUN.ev.catch === null && RUN.hops > 0) return 4;
    const L = RUN.log, i = Math.min(L.mode.length - 1, Math.max(0, Math.round(t / D.h)));
    return L.mode[i] === 1 ? 1 : 0.25;
}
function simT(f) {
    while (FT.length <= f) {
        const k = FT.length, t = FT[k - 1];
        if (k <= 30) { FT.push(0); continue; }
        RUN.advance(Math.min(t + 0.6, endT() + 0.1), LOG_EVERY); N = RUN.log.t.length;      // integrate a little ahead of the picture
        const tn = Math.min(t + speedOf(t) / FPS, endT());
        if (TL.catch !== null && RUN.ev.catch === null) TL.catch = null;                       // a catch that slipped
        if (TL.on === null && tn >= T_FREE) TL.on = k;
        if (TL.catch === null && RUN.ev.catch !== null && tn >= RUN.ev.catch) TL.catch = k;
        if (TL.release === null && RUN.ev.release !== null && tn >= RUN.ev.release) TL.release = k;
        if (TL.total === null && tn >= endT()) TL.total = k + 90;
        FT.push(tn);
    }
    return FT[f];
}
const speedAt = f => ({ 0.5: '½', 0.25: '¼', 1: 'full', 4: '4×' })[speedOf(simT(f))];
const tEndNow = t => RUN.ev.release !== null ? endT() : Math.max(34, t + 6);

// ------------------------------------------------------------------------------------------------ layout
const PL = { x: 40, y: 190, s: 1000 }, SC = PL.s / 2 / 2.25, CX = PL.x + PL.s / 2, CY = PL.y + PL.s / 2 - 40;
const ST = { x: 40, y: 1210, w: 1000, h: 300 }, CH = { x: 40, y: 1530, w: 1000, h: 140 };
const PHASES = [['chaos', 'motor off'], ['pump, steer', 'energy, swing'], ['wait', 'motor off'], ['catch, hold', 'tiny corrections'], ['let go', 'motor off']];
const phaseOf = m => m < 0 ? 0 : m === 0 ? 1 : m === 1 ? 2 : m === 2 ? 3 : 4;

function text(g, s, x, y, size, color, align, wt) { g.fillStyle = color; g.font = `${wt || 400} ${size}px "Instrument Sans"`; g.textAlign = align || 'left'; g.fillText(s, x, y); }
function card(g, x, y, w, h) { g.fillStyle = TH.paper; g.strokeStyle = TH.rule; g.lineWidth = 1; g.beginPath(); g.roundRect(x, y, w, h, 14); g.fill(); g.stroke(); }

function drawScene(g, f) {
    g.fillStyle = TH.bg; g.fillRect(0, 0, 1080, 1920);
    const t = simT(f); TL.tEnd = tEndNow(t); const s = stateAt(t), ph = phaseOf(s.mode), held = t > D.catch_t + 0.4, I = s.tau / D.kt, Imax = D.tau_max / D.kt;
    card(g, PL.x, PL.y, PL.s, PL.s);
    g.save(); g.beginPath(); g.roundRect(PL.x, PL.y, PL.s, PL.s, 14); g.clip();
    g.strokeStyle = TH.rule; g.lineWidth = 1; g.setLineDash([3, 7]); for (const r of [1, 2]) { g.beginPath(); g.arc(CX, CY, r * SC, 0, 7); g.stroke(); } g.setLineDash([]);
    // the target: the butterfly, faint, until it is caught
    const gA = held ? Math.max(0, 0.22 - 0.22 * (t - D.catch_t - 0.4) / 3) : 0.22;
    if (gA > 0.005) {
        g.strokeStyle = rgba(TH.ghost, gA); g.lineWidth = 1.4; g.beginPath();
        for (let i = 0; i < D.orbit_th1.length; i++) { const [x, h] = tip(D.orbit_th1[i], D.orbit_th2[i]); i ? g.lineTo(CX + SC * x, CY - SC * h) : g.moveTo(CX + SC * x, CY - SC * h); }
        g.stroke();
        text(g, 'the butterfly (target)', PL.x + 20, PL.y + 36, 20, rgba(TH.ghost, Math.min(1, 3 * gA)));
    }
    // the trail of the tip: the last 0.8 s while it searches; since the catch once it is held
    const t0 = held ? D.catch_t : Math.max(0, t - 0.8), n = Math.max(2, Math.round((t - t0) / D.h));
    g.globalCompositeOperation = TH.add; g.lineCap = 'round';
    let prev = null;
    for (let j = 0; j <= n; j++) {
        const tt = t0 + (t - t0) * j / n, st = stateAt(tt), [x, h] = tip(st.th1, st.th2), P = [CX + SC * x, CY - SC * h];
        if (prev) { const age = (t - tt), a = held ? 0.25 + 0.65 * Math.exp(-age / 2.5) : Math.exp(-age / 0.35);
            g.strokeStyle = rgba(TH.curve, a); g.lineWidth = held ? 2.0 : 2.6; g.beginPath(); g.moveTo(prev[0], prev[1]); g.lineTo(P[0], P[1]); g.stroke(); }
        prev = P;
    }
    g.globalCompositeOperation = 'source-over';
    // the machine: a bracket from the frame, the motor (stator with six coils, rotor with four magnets turning with the upper rod)
    const MR = 64;
    g.fillStyle = TH.steel; g.fillRect(CX - 10, PL.y, 20, CY - PL.y - MR + 6); g.fillRect(CX - 70, PL.y, 140, 12);
    g.strokeStyle = rgba(TH.motor, 0.55 + 0.45 * Math.min(1, Math.abs(I) / Imax)); g.lineWidth = 2;
    for (const dx of [-5, 5]) { g.beginPath(); g.moveTo(CX + dx, PL.y + 12); g.lineTo(CX + dx, CY - MR); g.stroke(); }
    g.fillStyle = TH.body; g.strokeStyle = TH.steel; g.lineWidth = 3; g.beginPath(); g.arc(CX, CY, MR, 0, 7); g.fill(); g.stroke();
    const glow = Math.min(1, Math.abs(I) / Imax);
    for (let c = 0; c < 6; c++) {
        const a0 = c * Math.PI / 3 + Math.PI / 6, cx = CX + (MR - 14) * Math.cos(a0), cy = CY + (MR - 14) * Math.sin(a0);
        g.save(); g.translate(cx, cy); g.rotate(a0);
        if (glow > 0.01) { g.fillStyle = rgba(TH.motor, 0.55 * glow); g.beginPath(); g.arc(0, 0, 18 + 10 * glow, 0, 7); g.fill(); }
        g.fillStyle = rgba(TH.copper, 0.95); g.beginPath(); g.roundRect(-8, -13, 16, 26, 4); g.fill();
        g.strokeStyle = 'rgba(0,0,0,0.35)'; g.lineWidth = 1; for (let w = -10; w <= 10; w += 4) { g.beginPath(); g.moveTo(-8, w); g.lineTo(8, w); g.stroke(); }
        g.restore();
    }
    const rot = -s.th1;                                    // the rotor turns with the upper rod
    for (let q = 0; q < 4; q++) {
        g.fillStyle = rgba(q % 2 ? TH.south : TH.north, 0.95); g.beginPath(); g.moveTo(CX, CY);
        g.arc(CX, CY, 34, rot + q * Math.PI / 2 + 0.08, rot + (q + 1) * Math.PI / 2 - 0.08); g.closePath(); g.fill();
    }
    g.fillStyle = TH.body; g.beginPath(); g.arc(CX, CY, 14, 0, 7); g.fill();
    // the torque, as an arc outside the motor
    const tq = s.tau, frac = Math.min(1, Math.abs(tq) / D.tau_max);
    if (frac > 0.01) {
        const a0 = -Math.PI / 2, a1 = a0 - Math.sign(tq) * frac * 1.6 * Math.PI;
        g.strokeStyle = rgba(TH.motor, 0.9); g.lineWidth = 6; g.beginPath(); g.arc(CX, CY, MR + 16, Math.min(a0, a1), Math.max(a0, a1)); g.stroke();
    }
    // the rods, and a pen at the tip
    const j1 = [CX + SC * Math.sin(s.th1), CY + SC * Math.cos(s.th1)], [x2, h2] = tip(s.th1, s.th2), j2 = [CX + SC * x2, CY - SC * h2];
    g.strokeStyle = TH.rods; g.lineWidth = 10; g.lineCap = 'round'; g.beginPath(); g.moveTo(CX, CY); g.lineTo(j1[0], j1[1]); g.lineTo(j2[0], j2[1]); g.stroke();
    g.fillStyle = TH.bob; g.beginPath(); g.arc(j1[0], j1[1], 14, 0, 7); g.fill(); g.strokeStyle = TH.ring; g.lineWidth = 3; g.stroke();
    const ux = Math.sin(s.th2), uy = Math.cos(s.th2);          // along the lower rod, outwards
    g.save(); g.translate(j2[0], j2[1]); g.rotate(Math.atan2(uy, ux));
    g.fillStyle = TH.nib; g.beginPath(); g.moveTo(-16, -9); g.lineTo(16, -3); g.lineTo(26, 0); g.lineTo(16, 3); g.lineTo(-16, 9); g.closePath(); g.fill();
    g.strokeStyle = TH.bob; g.lineWidth = 1.5; g.beginPath(); g.moveTo(-6, 0); g.lineTo(20, 0); g.stroke();
    g.fillStyle = TH.bob; g.beginPath(); g.arc(-2, 0, 3, 0, 7); g.fill();
    g.restore();
    g.fillStyle = rgba(TH.curve, 1); g.beginPath(); g.arc(j2[0] + 26 * ux, j2[1] + 26 * uy, 3.5, 0, 7); g.fill();
    text(g, s.mode === 3 || s.mode < 0 || (s.mode === 1) ? 'motor off' : `motor: ${Math.abs(tq).toFixed(1)} N·m, coil current ${Math.abs(I).toFixed(1)} A`, PL.x + PL.s - 20, PL.y + 38, 22, rgba(TH.motor, 1), 'right', 500);
    text(g, speedAt(f) === '4×' ? `missed, searching again (try ${RUN.hops + 1}): fast-forward ×4` : speedAt(f) === 'full' ? 'waiting: shown at real speed' : `shown at ${speedAt(f)} of real speed`, PL.x + PL.s - 20, PL.y + PL.s - 22, 18, TH.muted, 'right');
    g.restore();
    // the phases
    card(g, ST.x, ST.y, ST.w, ST.h);
    const pw = (ST.w - 40) / 5;
    PHASES.forEach(([a, b], i) => {
        const x = ST.x + 20 + i * pw, on = i === ph, done = i < ph;
        g.fillStyle = on ? rgba(TH.curve, 0.18) : 'rgba(0,0,0,0)'; g.beginPath(); g.roundRect(x + 4, ST.y + 18, pw - 8, 86, 10); g.fill();
        g.strokeStyle = on ? TH.accent : TH.rule; g.lineWidth = on ? 2 : 1; g.stroke();
        text(g, `${i + 1}  ${a}`, x + 16, ST.y + 54, 22, on ? TH.accent : done ? TH.ink : TH.muted, 'left', on ? 500 : 400);
        text(g, b, x + 16, ST.y + 86, 16, TH.muted);
    });
    const rows = [[`t = ${t.toFixed(2)} s`, TH.ink], [`energy ${s.E.toFixed(1)} J  (butterfly: ${D.E_star.toFixed(1)} J)`, rgba(TH.energy, 1)],
        [`motor torque ${Math.abs(tq).toFixed(1)} N·m  (limit ${D.tau_max.toFixed(0)})`, rgba(TH.motor, 1)],
        [s.mode >= 1 ? `distance from the butterfly ${s.dist.toFixed(s.dist < 0.01 ? 4 : 3)}` : 'distance from the butterfly: not yet near', TH.ink]];
    rows.forEach(([r, c], i) => text(g, r, ST.x + 24 + (i % 2) * 490, ST.y + 156 + Math.floor(i / 2) * 50, 23, c));
    text(g, `energy bar`, ST.x + 24, ST.y + 268, 17, TH.muted);
    const bx = ST.x + 130, bw = ST.w - 160, ef = clamp(s.E / 420, 0, 1), ex = bx + bw * D.E_star / 420;
    g.fillStyle = rgba(TH.energy, 0.2); g.fillRect(bx, ST.y + 254, bw, 16); g.fillStyle = rgba(TH.energy, 0.85); g.fillRect(bx, ST.y + 254, bw * ef, 16);
    g.strokeStyle = TH.ink; g.lineWidth = 2; g.beginPath(); g.moveTo(ex, ST.y + 246); g.lineTo(ex, ST.y + 278); g.stroke();
    // the record: energy and torque against time
    card(g, CH.x, CH.y, CH.w, CH.h);
    const tx = tt => CH.x + 20 + (CH.w - 40) * tt / TL.tEnd, ey = E => CH.y + CH.h - 16 - (CH.h - 32) * clamp(E / 420, 0, 1), qy = q => CH.y + CH.h / 2 - (CH.h / 2 - 16) * q / D.tau_max;
    g.strokeStyle = TH.rule; g.lineWidth = 1; g.beginPath(); g.moveTo(tx(D.t_free), CH.y + 10); g.lineTo(tx(D.t_free), CH.y + CH.h - 10); g.moveTo(tx(D.catch_t), CH.y + 10); g.lineTo(tx(D.catch_t), CH.y + CH.h - 10); g.stroke();
    for (const [key, y, col] of [['tau', qy, TH.motor], ['E', ey, TH.energy]]) {
        g.strokeStyle = rgba(col, 0.9); g.lineWidth = 1.6; g.beginPath();
        const m = Math.min(N - 1, Math.floor(t / D.h)), Lg = RUN.log;
        for (let i = 0; i <= m; i += 2) { const X = tx(Lg.t[i]), Y = y(Lg[key][i]); i ? g.lineTo(X, Y) : g.moveTo(X, Y); }
        g.stroke();
    }

    text(g, 'motor on', tx(D.t_free) + 6, CH.y + CH.h - 14, 15, TH.muted); text(g, 'caught', tx(D.catch_t) + 6, CH.y + CH.h - 14, 15, TH.muted);
}

// ------------------------------------------------------------------------------------------------ words under the picture
let CAPS;
function captions() {
    const F = v => v === null ? Infinity : v;
    TL.on = TL.on; const ON = F(TL.on), CA = F(TL.catch), RE = F(TL.release);
    CAPS = [
        [0, `A double pendulum, ${START_NAME}, energy ${PEND.energy(START).toFixed(0)} J. A pen at its tip, a motor at its pin, switched off. Choose another start above: a strike on the chaos map, or a random chaotic state.`],
        [ON, 'The motor switches on. Current in its coils pushes on the magnets of the rotor: torque = 2.5 N·m per ampere. It pumps the energy to the butterfly\'s 390.8 J and steers the upper rod\'s swing to the butterfly\'s size.<br><span style="font-size:22px;color:var(--muted)">energy E, torque τ:  dE/dt = τ · dθ₁/dt</span>'],
        [CA, 'Close enough: the motor makes small corrections along the butterfly\'s own lap, a feedback designed on the orbit (as in our control lessons).'],
        [CA + 200, 'Caught. The motor holds it for four laps; the corrections shrink below 0.1 N·m.'],
        [RE, 'Let go: the motor switches off. The butterfly is unstable by itself, but only barely (an error grows 2 % a lap), so the pen keeps drawing it: within 0.1 of the exact path for minutes (about 7 in the median of 40 released runs, 41 s in the worst), its wings unchanged for an hour in a run followed that long.'],
        [RE + 330, 'From 300 random starts the motor caught every one: half within 18 s of switching on, the slowest after 229 s. How long this run took depends on the last digit of your device\'s arithmetic. The theory and the method: the catch note on the Fig. 13 page.'],
    ];
}
const memo = {};
function setHTML(el, key, html) { if (memo[key] !== html) { memo[key] = html; el.innerHTML = html; } }

// keep words inside their boxes: a browser's translation can make them longer; shrink the type until they fit, never spill over the drawing
function fitBox(el, maxH, base, min) { if (!el) return; let fs = base; el.style.fontSize = fs + 'px'; while (el.scrollHeight > maxH && fs > min) { fs -= 1; el.style.fontSize = fs + 'px'; } }
function showCaption(f) {
    let k = 0; while (k + 1 < CAPS.length && f >= CAPS[k + 1][0]) k++;
    const u = k === 0 ? ease(f / 30) : ease((f - CAPS[k][0]) / 14), prev = k > 0 ? CAPS[k - 1][1] : '';
    const [cur, old] = (k % 2 === 0) ? [$('capA'), $('capB')] : [$('capB'), $('capA')];
    setHTML(cur, 'c' + cur.id, CAPS[k][1]); setHTML(old, 'c' + old.id, prev); cur.style.opacity = Math.max(0, 2 * u - 1); old.style.opacity = Math.max(0, 1 - 2 * u);   // the old words leave before the new ones come: never two captions on top of each other
    if (f % 6 === 0) for (const id of ['capA','capB']) fitBox($(id), 210, 30, 14);
    if (f % 6 === 0) for (const id of ['h2']) fitBox($(id), 68, 22, 12);
}

let g, DPR = 1;
function renderFrame(f) { g.setTransform(DPR, 0, 0, DPR, 0, 0); drawScene(g, f); captions(); showCaption(f); }
window.renderFrame = renderFrame;
async function boot() {
    DPR = window.devicePixelRatio || 1;
    DES = PEND.design();                                     // the orbit, its linearisation and the motor's gains: computed here, ~0.1 s
    RUN = new PEND.Run(DES, START, T_FREE, HOLD_LAPS);
    const C = PEND.consts, OB = DES.S.filter((x, i) => i % 4 === 0);
    D = { h: LOG_EVERY * C.H, T: C.T, t_free: T_FREE, E_star: DES.Estar, tau_max: C.TAU_MAX, kt: C.KT, orbit_th1: OB.map(x => x[0]), orbit_th2: OB.map(x => x[1]),
          get catch_t() { return RUN.ev.catch === null ? Infinity : RUN.ev.catch; }, get release_t() { return RUN.ev.release === null ? Infinity : RUN.ev.release; } };
