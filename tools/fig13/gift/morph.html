<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Turning the paper</title>
<!-- Film renderer: one plot becomes another by turning the drawing surface.
     Serve the repository root and open tools/fig13/gift/morph.html?scene=wheel|butterfly&theme=dark|light ;
     tools/fig13/gift/render.cjs writes the frames (page=morph). Not part of the site.
     The mathematics: each instant is the point (x(t), h(t), tau(t)) with tau = k (t - T/2) along a time axis. Turning the
     paper by phi about the vertical shows   screen x = tau cos(phi) + x sin(phi),  screen y = h.
     phi = 0: height against time (the time plot). phi = 90 deg: height against sideways position, i.e. the path in space. -->
<link rel="stylesheet" href="../../../public/vendor/katex/katex.min.css">
<style>
@font-face { font-family: 'Instrument Serif'; src: url(../../../public/fonts/instrument-serif/instrument-serif-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Sans'; src: url(../../../public/fonts/ibm-plex-sans/ibm-plex-sans-400-latin.woff2) format('woff2'); }
@font-face { font-family: 'IBM Plex Mono'; src: url(../../../public/fonts/ibm-plex-mono/ibm-plex-mono-400-latin.woff2) format('woff2'); }
:root { --bg:#140d10; --panel:#1a1114; --rule:#3a2a2e; --ink:#f5f1ea; --ink2:#d9cdc4; --muted:#b9a59b; --accent:#e2a2aa; }
:root[data-theme="light"] { --bg:#f5f1ea; --panel:#fffaf3; --rule:#d9d0c2; --ink:#1c1518; --ink2:#3a322e; --muted:#6f635d; --accent:#7a1f2b; }
html, body { margin:0; background:var(--bg); height:100%; overflow:hidden; }   /* the stage never widens the page, so a phone does not zoom out */
#stage { position:absolute; left:0; top:0; }
#stage { position:relative; width:1920px; height:1080px; background:var(--bg); color:var(--ink); font-family:'IBM Plex Sans',sans-serif; overflow:hidden; transform-origin:0 0; }
.card { position:absolute; background:var(--panel); border:1px solid var(--rule); border-radius:16px; }
.slot { position:absolute; border:1px dashed var(--rule); border-radius:14px; }
#h1 { position:absolute; left:56px; top:30px; font-family:'Instrument Serif',serif; font-size:60px; line-height:1; margin:0; font-weight:400; }
#h2 { position:absolute; left:58px; top:100px; font-family:'IBM Plex Mono',monospace; font-size:15px; color:var(--muted); }
#clock { position:absolute; right:56px; top:44px; font-family:'IBM Plex Mono',monospace; font-size:18px; color:var(--ink2); text-align:right; }
#clock b { color:var(--accent); font-weight:400; }
#stageT { position:absolute; left:642px; top:186px; font-family:'Instrument Serif',serif; font-size:32px; }
#stageT small { font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); margin-right:12px; }
#cap { position:absolute; right:82px; top:194px; font-size:20px; color:var(--ink2); text-align:right; }
#deckT { position:absolute; left:58px; top:150px; font-family:'IBM Plex Mono',monospace; font-size:12.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--muted); }
canvas { position:absolute; left:0; top:0; }
</style>
</head>
<body>
<div id="stage">
  <h1 id="h1"></h1>
  <div id="h2"></div>
  <div id="clock"></div>
  <div id="deckT">earlier pictures</div>
  <div class="slot" style="left:56px;top:176px;width:520px;height:262px"></div>
  <div class="slot" style="left:56px;top:458px;width:520px;height:262px"></div>
  <div class="slot" style="left:56px;top:740px;width:520px;height:262px"></div>
  <div class="card" style="left:616px;top:170px;width:1248px;height:832px"></div>
  <canvas id="cvMain"></canvas>
  <div id="stageT"></div>
  <div id="cap"></div>
  <canvas id="cvDeck"></canvas>
</div>
<script src="../../../public/vendor/katex/katex.min.js"></script>
<script>
'use strict';
const Q = new URLSearchParams(location.search);
const THEME = Q.get('theme') === 'light' ? 'light' : 'dark', SCENE = Q.get('scene') === 'wheel' ? 'wheel' : 'butterfly';
document.documentElement.dataset.theme = THEME;
const $ = id => document.getElementById(id);
const lerp = (a, b, f) => a + (b - a) * f, clamp = (v, a, b) => Math.min(b, Math.max(a, v));
const ease = u => u <= 0 ? 0 : u >= 1 ? 1 : u * u * (3 - 2 * u);
const TH = THEME === 'dark'
    ? { bg: '#140d10', panel: '#1a1114', rule: '#3a2a2e', ink: '#f5f1ea', muted: '#b9a59b', grid: 'rgba(226,162,170,0.13)', rods: '#f5f1ea', bob: '#7a1f2b', ring: '#f5f1ea',
        ramp: [[122, 31, 43], [226, 162, 170], [255, 246, 234]], glowA: 0.18, add: 'lighter', head: '#fff6ea', card: 'rgba(226,162,170,0.06)', cardEdge: 'rgba(226,162,170,0.35)' }
    : { bg: '#f5f1ea', panel: '#fffaf3', rule: '#d9d0c2', ink: '#1c1518', muted: '#6f635d', grid: 'rgba(28,21,24,0.10)', rods: '#1c1518', bob: '#7a1f2b', ring: '#fffaf3',
        ramp: [[226, 162, 170], [122, 31, 43], [28, 21, 24]], glowA: 0.10, add: 'source-over', head: '#7a1f2b', card: 'rgba(122,31,43,0.05)', cardEdge: 'rgba(122,31,43,0.35)' };
function rampCol(u, a) {   // colour along time: early to late
    const r = TH.ramp, k = u < 0.5 ? 0 : 1, f = u < 0.5 ? u * 2 : (u - 0.5) * 2, c = r[k].map((v, i) => Math.round(v + (r[k + 1][i] - v) * f));
    return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

// ---------------------------------------------------------------------------------------------------------------- scenes
// Each scene gives: T (s), sample(t) -> [x, h] in metres (h up), drawThing(g, t, S) for stage 1, words and equations.
let SC;
async function loadScene() {
    if (SCENE === 'wheel') {
        const T = 6, w = 2 * Math.PI * 3 / T;
        SC = { T, slow: 1, k: 6.4 / T,
            sample: t => [2 * Math.cos(w * t), 2 * Math.sin(w * t)],
            title: 'Turning the paper: a wheel', sub: 'a point on a wheel of radius 2 m, turning three times in 6 s. The same picture, seen from two sides.',
            names: ['the wheel', 'height against time', 'the paper turned by 45°', 'looking down the time axis'],
            caps: [String.raw`x=2\cos\omega t,\quad h=2\sin\omega t`, String.raw`h(t)=2\sin\omega t\ \ \text{(a sine wave)}`,
                   String.raw`\text{screen}=\bigl(\tau\cos\varphi+x\sin\varphi,\ h\bigr),\quad \tau=k\,(t-\tfrac T2)`, String.raw`\varphi=90^\circ:\ \ (x,\,h)\ \ \text{(the circle)}`],
            drawThing(g, t, S, cx, cy) {
                const [x, h] = SC.sample(t);
                g.strokeStyle = TH.rule; g.lineWidth = 1.5; g.beginPath(); g.arc(cx, cy, 2 * S, 0, 7); g.stroke();
                g.strokeStyle = TH.rods; g.lineWidth = 8; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy); g.lineTo(cx + S * x, cy - S * h); g.stroke();
                bob(g, cx + S * x, cy - S * h, 13); pivot(g, cx, cy);
            } };
    } else {
        const O = await (await fetch('orbit24.json')).json();
        const at = t => { const u = clamp(t, 0, O.T) * O.rate, i = Math.min(Math.floor(u), O.th1.length - 2), f = u - i; return [lerp(O.th1[i], O.th1[i + 1], f), lerp(O.th2[i], O.th2[i + 1], f)]; };
        SC = { T: O.T, slow: 4, k: 6.4 / O.T, O,
            sample: t => { const [a, b] = at(t); return [Math.sin(a) + Math.sin(b), -(Math.cos(a) + Math.cos(b))]; },
            title: 'Turning the paper: a butterfly', sub: `two equal rods, 1 kg and 1 m, kicked once with p = (${O.p1.toFixed(3)}, ${O.p2.toFixed(3)}) kg·m²/s. Its height over time, turned until the butterfly appears.`,
            names: ['the pendulum', 'height of the tip against time', 'the paper turned by 45°', 'looking down the time axis'],
            caps: [String.raw`\theta_1(t),\ \theta_2(t)\ \text{from Hamilton's equations;}\ \ x=l(\sin\theta_1+\sin\theta_2),\ \ h=-l(\cos\theta_1+\cos\theta_2)`,
                   String.raw`h(t):\ \text{one dip to the pivot for every petal}`,
                   String.raw`\text{screen}=\bigl(\tau\cos\varphi+x\sin\varphi,\ h\bigr),\quad \tau=k\,(t-\tfrac T2)`,
                   String.raw`\varphi=90^\circ:\ \ (x,\,h)\ \ \text{the path of the tip: the butterfly}`],
            drawThing(g, t, S, cx, cy) {
                const [a, b] = at(t), x1 = cx + S * Math.sin(a), y1 = cy + S * Math.cos(a);
                const x2 = x1 + S * Math.sin(b), y2 = y1 + S * Math.cos(b);
                g.strokeStyle = TH.rods; g.lineWidth = 9; g.lineCap = 'round'; g.beginPath(); g.moveTo(cx, cy); g.lineTo(x1, y1); g.lineTo(x2, y2); g.stroke();
                bob(g, x1, y1, 13); bob(g, x2, y2, 13); pivot(g, cx, cy);
            } };
    }
}
function bob(g, x, y, r) { g.fillStyle = TH.bob; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); g.strokeStyle = TH.ring; g.lineWidth = 3; g.stroke(); }
function pivot(g, x, y) { g.fillStyle = TH.panel; g.beginPath(); g.arc(x, y, 7, 0, 7); g.fill(); g.strokeStyle = TH.rods; g.lineWidth = 3; g.stroke(); }

// ---------------------------------------------------------------------------------------------------------------- timeline
const FPS = 30, TR = 26;
let TL;
function timeline() {
    const I = 30, s1 = Math.round(SC.T * SC.slow * FPS), s2 = 150, h2 = 24, s3 = 270, end = 140;
    const a1 = I, b1 = a1 + s1, a2 = b1 + TR, b2 = a2 + s2, a3 = b2 + h2 + TR, b3 = a3 + s3;
    TL = { I, a1, b1, a2, b2, a3, b3, total: b3 + end,
           spawns: [{ f: b1, slot: 0 }, { f: b2 + h2, slot: 1 }, { f: a3 + Math.round(s3 * 0.5), slot: 2 }] };
}
function phiAt(f) { return f < TL.a3 ? 0 : (Math.PI / 2) * ease((f - TL.a3) / (TL.b3 - TL.a3)); }
function stageOf(f) { return f < TL.a2 ? 0 : f < TL.a3 ? 1 : f < TL.b3 ? 2 : 3; }

// ---------------------------------------------------------------------------------------------------------------- the present picture (a pure function of the frame)
const MAIN = { x: 616, y: 170, w: 1248, h: 832 }, S = 150;
let N = 0, XS, HS, TS;
function precompute() {
    N = 4000; XS = new Float64Array(N + 1); HS = new Float64Array(N + 1); TS = new Float64Array(N + 1);
    for (let k = 0; k <= N; k++) { const t = SC.T * k / N, [x, h] = SC.sample(t); XS[k] = x; HS[k] = h; TS[k] = t; }
}
function drawPresent(g, f, W, H) {
    g.clearRect(0, 0, W, H);
    const cx = W / 2, cy = H / 2 - 10, st = stageOf(f);
    if (st === 0) {                                   // the thing itself, drawing its path
        const t = clamp((f - TL.a1) / (SC.slow * FPS), 0, SC.T), n = Math.round(t / SC.T * N);
        pathTrace(g, k => [cx + S * XS[k], cy - S * HS[k]], n, 2.6);
        SC.drawThing(g, t, S, cx, cy);
        return;
    }
    // stages 1-3: the space-time curve seen with the paper turned by phi
    const phi = phiAt(f), c = Math.cos(phi), s = Math.sin(phi), k = SC.k;
    const reveal = st === 1 ? clamp((f - TL.a2) / (TL.b2 - TL.a2), 0, 1) : 1, n = Math.round(reveal * N);
    const px = j => (TS[j] - SC.T / 2) * k * c + XS[j] * s, depth = j => -(TS[j] - SC.T / 2) * k * s + XS[j] * c;
    // the sheet of the time plot (the drawing surface), turning with it
    const L = SC.T * k / 2, corners = [[-L, 2.3], [L, 2.3], [L, -2.3], [-L, -2.3]];
    g.fillStyle = TH.card; g.strokeStyle = TH.cardEdge; g.lineWidth = 1.2;
    g.beginPath(); corners.forEach(([tau, h], i) => { const X = cx + S * tau * c, Y = cy - S * h; i ? g.lineTo(X, Y) : g.moveTo(X, Y); }); g.closePath(); g.fill(); g.stroke();
    // grid lines on the sheet: one per second of time, and the h = 0 line
    g.strokeStyle = TH.grid; g.lineWidth = 1;
    for (let sec = 0; sec <= SC.T + 1e-9; sec += SC.T > 3 ? 1 : 0.5) { const X = cx + S * (sec - SC.T / 2) * k * c; g.beginPath(); g.moveTo(X, cy - S * 2.3); g.lineTo(X, cy + S * 2.3); g.stroke(); }
    g.beginPath(); g.moveTo(cx - S * L * c, cy); g.lineTo(cx + S * L * c, cy); g.stroke();
    // the end sheet (where the path in space lives), fading in as we look down the time axis
    if (s > 0.02) {
        g.globalAlpha = s; g.strokeStyle = TH.cardEdge; g.setLineDash([4, 6]);
        g.beginPath(); g.arc(cx + S * L * c, cy, 2 * S * s, 0, 7); g.stroke(); g.setLineDash([]); g.globalAlpha = 1;
    }
    // axis labels drawn on the sheet
    g.fillStyle = TH.muted; g.font = '17px "IBM Plex Mono"'; g.textAlign = 'center';
    const aT = clamp((c - 0.866) / 0.1, 0, 1), aS = clamp((s - 0.866) / 0.1, 0, 1);   // 'time' below 30 deg, 'sideways' above 60 deg
    if (aT > 0) { g.globalAlpha = aT; g.fillText('time →', cx, cy + S * 2.3 + 26); g.globalAlpha = 1; }
    if (aS > 0) { g.globalAlpha = aS; g.fillText('sideways position →', cx, cy + S * 2.3 + 26); g.globalAlpha = 1; }
    g.save(); g.translate(cx - S * Math.max(L * c, 2.05 * s) - 28, cy); g.rotate(-Math.PI / 2); g.fillText('height', 0, 0); g.restore();
    // the curve, coloured by time, nearer parts brighter
    g.globalCompositeOperation = TH.add; g.lineJoin = 'round'; g.lineCap = 'butt';
    const step = 2;
    for (let j = 0; j + step <= n; j += step) {
        const u = j / N, d = depth(j) / (L + 2.05), near = clamp(0.62 + 0.38 * (s > 0.05 ? -d : 0), 0.25, 1);
        const x0 = cx + S * px(j), y0 = cy - S * HS[j], x1 = cx + S * px(j + step), y1 = cy - S * HS[j + step];
        g.strokeStyle = rampCol(u, TH.glowA * near); g.lineWidth = 8; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        g.strokeStyle = rampCol(u, 0.95 * near); g.lineWidth = 2.6; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
    if (st === 1 && n > 0) { g.fillStyle = TH.head; g.beginPath(); g.arc(cx + S * px(n), cy - S * HS[n], 7, 0, 7); g.fill(); }
    if (st === 3) pivot(g, cx, cy);
}
function pathTrace(g, P, n, lw) {
    g.globalCompositeOperation = TH.add; g.lineJoin = 'round'; g.lineCap = 'butt';
    for (let j = 0; j + 2 <= n; j += 2) {
        const [x0, y0] = P(j), [x1, y1] = P(j + 2), u = j / N;
        g.strokeStyle = rampCol(u, TH.glowA); g.lineWidth = 8; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
        g.strokeStyle = rampCol(u, 0.95); g.lineWidth = lw; g.beginPath(); g.moveTo(x0, y0); g.lineTo(x1, y1); g.stroke();
    }
    g.globalCompositeOperation = 'source-over';
}

// ---------------------------------------------------------------------------------------------------------------- the deck of earlier pictures
const SLOTS = [{ x: 56, y: 176, w: 520, h: 262 }, { x: 56, y: 458, w: 520, h: 262 }, { x: 56, y: 740, w: 520, h: 262 }];
const snaps = {};
let DPR = 1;
function snapshot(fs) {
    if (snaps[fs]) return snaps[fs];
    const c = document.createElement('canvas'); c.width = MAIN.w * DPR; c.height = MAIN.h * DPR;
    const g = c.getContext('2d'); g.setTransform(DPR, 0, 0, DPR, 0, 0); g.beginPath(); g.roundRect(1, 1, MAIN.w - 2, MAIN.h - 2, 15); g.clip(); drawPresent(g, fs, MAIN.w, MAIN.h);
    return (snaps[fs] = c);
}
function drawDeck(g, f) {
    g.clearRect(0, 0, 1920, 1080);
    TL.spawns.forEach((sp, i) => {
        if (f < sp.f) return;
        const u = ease((f - sp.f) / TR), slot = SLOTS[sp.slot];
        const sc = Math.min(slot.w / MAIN.w, (slot.h - 34) / MAIN.h);
        const tw = MAIN.w * sc, th = MAIN.h * sc, tx = slot.x + (slot.w - tw) / 2, ty = slot.y + 30 + (slot.h - 30 - th) / 2;
        const x = lerp(MAIN.x, tx, u), y = lerp(MAIN.y, ty, u), w = lerp(MAIN.w, tw, u), h = lerp(MAIN.h, th, u);
        g.globalAlpha = lerp(1, 0.55, u); g.drawImage(snapshot(sp.f), x, y, w, h); g.globalAlpha = 1;
        if (u > 0.6) {
            g.globalAlpha = (u - 0.6) / 0.4; g.fillStyle = TH.muted; g.font = '15px "IBM Plex Mono"'; g.textAlign = 'left';
            g.fillText(`${i + 1} · ${SC.names[i]}`, slot.x + 16, slot.y + 24); g.globalAlpha = 1;
        }
    });
}

// ---------------------------------------------------------------------------------------------------------------- frame
const memo = {};
function setHTML(id, html) { if (memo[id] !== html) { memo[id] = html; $(id).innerHTML = html; } }
function setTeX(id, s) { if (memo[id] !== s) { memo[id] = s; katex.render(s, $(id), { throwOnError: false }); } }
let gMain, gDeck;
function renderFrame(f) {
    gMain.setTransform(DPR, 0, 0, DPR, 0, 0); gMain.clearRect(0, 0, 1920, 1080); gMain.save(); gMain.translate(MAIN.x, MAIN.y);
    gMain.beginPath(); gMain.roundRect(1, 1, MAIN.w - 2, MAIN.h - 2, 15); gMain.clip(); drawPresent(gMain, f, MAIN.w, MAIN.h); gMain.restore();
    gDeck.setTransform(DPR, 0, 0, DPR, 0, 0); drawDeck(gDeck, f);
    const st = stageOf(f), phi = phiAt(f), names = SC.names;
    const label = st === 2 ? `the paper turned by ${Math.round(phi * 180 / Math.PI)}°` : names[st];
    setHTML('stageT', `<small>${st + 1}</small>${label}`);
    setTeX('cap', SC.caps[st]);
    const t = st === 0 ? clamp((f - TL.a1) / (SC.slow * FPS), 0, SC.T) : SC.T;
    setHTML('clock', st === 0 ? `t = <b>${t.toFixed(3)}</b> s · 1/${SC.slow} of real speed` : st === 1 ? 'the same motion, drawn against time' : st === 2 ? `φ = <b>${(phi * 180 / Math.PI).toFixed(1)}°</b>` : 'φ = <b>90°</b> · the time axis points at you');
}
window.renderFrame = renderFrame;
async function boot() {
    DPR = window.devicePixelRatio || 1;
    await loadScene(); timeline(); precompute();
    $('h1').textContent = SC.title; $('h2').textContent = SC.sub;
    for (const id of ['cvMain', 'cvDeck']) { const c = $(id); c.width = 1920 * DPR; c.height = 1080 * DPR; c.style.width = '1920px'; c.style.height = '1080px'; }
    gMain = $('cvMain').getContext('2d'); gDeck = $('cvDeck').getContext('2d');
    await document.fonts.ready;
    await Promise.all(['IBM Plex Mono', 'IBM Plex Sans', 'Instrument Serif'].map(fn => document.fonts.load(`20px "${fn}"`)));
    window.FILM = { frames: () => TL.total };
    renderFrame(Number(Q.get('f') || 0)); window.__ready = true;
    if (!Q.get('film')) { let f = 0; const loop = () => { renderFrame(f % TL.total); f++; requestAnimationFrame(loop); }; loop(); }
}
function fit() {   // scale the stage to the screen (the layout viewport, not innerWidth, which a phone may enlarge) and centre it
    const cw = document.documentElement.clientWidth, ch = document.documentElement.clientHeight, s = Math.min(cw / 1920, ch / 1080, 1);
    $('stage').style.transform = `translate(${Math.max(0, (cw - 1920 * s) / 2)}px, 0) scale(${s})`;
}
if (!Q.get('film')) { fit(); addEventListener('resize', fit); }
boot();
</script>
</body>
</html>
